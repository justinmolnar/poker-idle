<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1">
    <title>Poker Idle</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
      }
      h1, footer { display: none; }
      /* Canvas fills the iframe (which itch sizes to the viewport when
         "click to launch in fullscreen" is on). object-fit: contain
         letterboxes the 16:9 bitmap into whatever aspect the viewport
         is. Pixelated rendering keeps the chunky pixel-font look. */
      canvas#canvas, canvas#loadingCanvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        background: #000;
      }
      #canvas { visibility: hidden; }
    </style>
  </head>
  <body>
    <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()" width="800" height="600"></canvas>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script type="text/javascript">
      // Render the canvas at the viewport's actual device-pixel resolution
      // (CSS pixels x devicePixelRatio). The browser then displays the
      // bitmap 1:1 with device pixels — no fractional scaling, no fuzzy
      // fonts on HiDPI displays.
      //
      // - canvas.width/height (HTML attributes) = device pixel dimensions.
      //   This is what LOVE renders into; LOVE's getDimensions() returns
      //   these. Layout adapts via FontService.rebuildInto in love.resize.
      // - canvas.style.width/height = CSS pixel dimensions, so the
      //   displayed canvas fills the whole viewport at logical size.
      //
      // window.dispatchEvent('resize') after the change forces SDL2's
      // Emscripten port to pick up the new canvas size and dispatch
      // SDL_WINDOWEVENT_RESIZED — which is what triggers love.resize.
      var _last_w = 0, _last_h = 0;
      function fitAll() {
        var c = document.getElementById('canvas');
        var lc = document.getElementById('loadingCanvas');
        if (!c) return;
        var dpr = window.devicePixelRatio || 1;
        var w_css = window.innerWidth;
        var h_css = window.innerHeight;
        var w_dev = Math.floor(w_css * dpr);
        var h_dev = Math.floor(h_css * dpr);
        // Re-apply if the target changed OR something (SDL_CreateWindow) reset
        // the canvas backing store out from under us — the latter is why the
        // delayed refits below exist.
        if (w_dev === _last_w && h_dev === _last_h &&
            c.width === w_dev && c.height === h_dev) return;
        _last_w = w_dev;
        _last_h = h_dev;
        c.width  = w_dev;
        c.height = h_dev;
        c.style.setProperty('width',  w_css + 'px', 'important');
        c.style.setProperty('height', h_css + 'px', 'important');
        if (lc) {
          lc.style.setProperty('width',  w_css + 'px', 'important');
          lc.style.setProperty('height', h_css + 'px', 'important');
        }
        // SDL2's Emscripten port listens for window.resize. Dispatch one
        // so love.resize fires with the new dimensions.
        window.dispatchEvent(new Event('resize'));
      }

      // Entering itch's fullscreen resizes the iframe viewport, but the new
      // innerWidth/innerHeight can lag the event and SDL re-asserts the canvas
      // to conf.lua's size right after. So every size signal triggers an
      // immediate fit PLUS a few delayed fits to win that race.
      var _refits = [];
      function fitSoon() {
        fitAll();
        _refits.forEach(clearTimeout);
        _refits = [50, 150, 400, 800, 1500].map(function (d) {
          return setTimeout(fitAll, d);
        });
      }
      // The first fit is wired into setStatus once Module is fully loaded.
      // These keep the canvas matched to the viewport for every later change:
      // window resizes and entering/leaving fullscreen (whichever document the
      // fullscreen event lands on).
      window.addEventListener('resize', fitSoon);
      ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange',
       'MSFullscreenChange'].forEach(function (ev) {
        document.addEventListener(ev, fitSoon);
      });
      // visualViewport fires on viewport changes that the window 'resize'
      // event misses on some setups — a more reliable signal where available.
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', fitSoon);
      }
      // Belt-and-suspenders: on some setups (seen on a 4K/HiDPI monitor) the
      // itch fullscreen transition (and even closing devtools) doesn't deliver
      // a resize the shell can catch, so the canvas stays at its old size and
      // the CSS box stretches it up until some unrelated later event nudges
      // it. A fast poll guarantees the canvas matches the viewport regardless
      // of which events fire. fitAll early-returns when nothing changed, so
      // this is nearly free.
      setInterval(fitAll, 200);
    </script>

    <script type="text/javascript">
      function goFullScreen() {
        var canvas = document.getElementById("canvas");
        if (canvas.requestFullScreen) canvas.requestFullScreen();
        else if (canvas.webkitRequestFullScreen) canvas.webkitRequestFullScreen();
        else if (canvas.mozRequestFullScreen) canvas.mozRequestFullScreen();
      }
      var loadingContext = document.getElementById('loadingCanvas').getContext('2d');
      function drawLoadingText(text) {
        var canvas = loadingContext.canvas;
        loadingContext.fillStyle = "rgb(20, 20, 20)";
        loadingContext.fillRect(0, 0, canvas.width, canvas.height);
        loadingContext.font = '2em arial';
        loadingContext.textAlign = 'center';
        loadingContext.fillStyle = "rgb(180, 180, 180)";
        loadingContext.fillText(text, canvas.width / 2, canvas.height / 2);
      }

      window.onload = function () { window.focus(); };
      window.onclick = function () { window.focus(); };

      window.addEventListener("keydown", function(e) {
        if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
      }, false);

      // ── Gameplay analytics telemetry ────────────────────────────────────
      // This love.js build exports no Module.FS (no FORCE_FILESYSTEM /
      // EXPORTED_RUNTIME_METHODS), so JS on the page can't read
      // love.filesystem's virtual disk directly. Instead, Lua pushes data
      // out itself: services/HandAnalytics.lua's flush() print()s the
      // payload behind a marker (only on web, only with consent) whenever
      // the 30s autosave tick or love.quit() fires. Every Emscripten build
      // always routes print() through Module.print (or console.log if
      // unset) regardless of build flags, so this needs no engine rebuild.
      // Fill in ANALYTICS_ENDPOINT once your Cloudflare Worker (or
      // equivalent) is live. Leave it empty to disable sending entirely.
      var ANALYTICS_ENDPOINT = 'https://poker-idle-analytics.noicegamestudio.workers.dev';
      var ANALYTICS_MARKER   = '@@POKERIDLE_ANALYTICS@@';

      var Module = {
        arguments: ["./game.love"],
        INITIAL_MEMORY: 268435456,
        printErr: console.error.bind(console),
        print: function(text) {
          if (ANALYTICS_ENDPOINT && typeof text === 'string' && text.indexOf(ANALYTICS_MARKER) === 0) {
            fetch(ANALYTICS_ENDPOINT, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: text.slice(ANALYTICS_MARKER.length),
              keepalive: true,
            }).catch(function() {});   // fire-and-forget; ignore network errors
            return;
          }
          console.log(text);
        },
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) {
            alert('WebGL context lost. You will need to reload the page.');
            e.preventDefault();
          }, false);
          return canvas;
        })(),
        setStatus: function(text) {
          if (text) {
            drawLoadingText(text);
          } else if (Module.remainingDependencies === 0) {
            document.getElementById('loadingCanvas').style.display = 'none';
            document.getElementById('canvas').style.visibility = 'visible';
            // Initial fit + delayed refits to override Emscripten's
            // SDL_CreateWindow setting canvas back to conf.lua dims (1600x900)
            // after our first call. Each fit dispatches a window.resize so
            // love.resize fires with the new device-pixel dimensions.
            fitSoon();
          }
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function(left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Loading... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'Ready.');
        }
      };
      Module.setStatus('Downloading...');
      window.onerror = function(event) {
        Module.setStatus('Exception thrown, see JavaScript console');
        Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
        };
      };

      // Emscripten's FS persists to IndexedDB asynchronously; closing the
      // tab can discard writes the game already made. Nudge a sync when the
      // page hides or unloads so the last autosave actually lands. Older
      // love.js builds export no FS object — the guard makes this a no-op
      // there, and the in-game focus-loss flush still covers the Lua side.
      var flushFS = function() {
        try {
          var FSref = (typeof FS !== 'undefined' && FS) || (Module && Module.FS);
          if (FSref && FSref.syncfs) FSref.syncfs(false, function() {});
        } catch (e) {}
      };
      window.addEventListener('beforeunload', flushFS);
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'hidden') flushFS();
      });

      var applicationLoad = function(e) { Love(Module); };
    </script>

    <script type="text/javascript" src="game.js"></script>
    <script async type="text/javascript" src="love.js" onload="applicationLoad(this)"></script>
  </body>
</html>
