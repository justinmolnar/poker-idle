  root.appendChild(bar);

  let rows = S.model.items.filter(matchItem);
  const col = TABLE_COLS.find(c => c.key === S.ui.sort.col) || TABLE_COLS[0];
  rows = rows.slice().sort((a, b) => {
    const va = col.get(a), vb = col.get(b);
    const cmp = (typeof va === "number" && typeof vb === "number")
      ? va - vb : String(va).localeCompare(String(vb));
    return cmp * S.ui.sort.dir || a.no - b.no;
  });

  const table = el("table", { class: "items" });
  const thead = el("thead"); const htr = el("tr");
  htr.appendChild(el("th", {}, `<input type="checkbox" id="selall">`));
  for (const c of TABLE_COLS) {
    const th = el("th", { class: S.ui.sort.col === c.key ? "sorted" : "" },
      esc(c.label) + (S.ui.sort.col === c.key ? (S.ui.sort.dir > 0 ? " ▲" : " ▼") : ""));
    th.addEventListener("click", () => {
      if (S.ui.sort.col === c.key) S.ui.sort.dir *= -1;
      else { S.ui.sort.col = c.key; S.ui.sort.dir = 1; }
      render();
    });
    htr.appendChild(th);
  }
  thead.appendChild(htr); table.appendChild(thead);
  const tbody = el("tbody");

  const groupBy = S.ui.groupBy;
  let lastGroup = null;
  let lastClickedIdx = null;
  const visibleIds = rows.map(r => r.id);
  rows.forEach((it, idx) => {
    if (groupBy) {
      const g = groupKeyOf(it, groupBy);
      if (g !== lastGroup) {
        lastGroup = g;
        const members = rows.filter(r => groupKeyOf(r, groupBy) === g);
        const cost = members.reduce((a, r) => a + (r.ownable ? deriveCost(effective(r).cost_chip) : 0), 0);
        tbody.appendChild(el("tr", { class: "grouphdr" },
          `<td colspan="${TABLE_COLS.length + 1}">${esc(g)} — ${members.length} items · ${cost} ${chipSvg(11, COLORS.chip, COLORS.chipRing)}</td>`));
      }
    }
    const eff = effective(it);
    const tr = el("tr", { class: "item", "data-id": it.id });
    const cbTd = el("td", {}, `<input type="checkbox" ${S.selected.has(it.id) ? "checked" : ""}>`);
    const cb = cbTd.firstChild;
    cb.addEventListener("click", (ev) => {
      ev.stopPropagation();
      if (ev.shiftKey && lastClickedIdx != null) {
        const [a, b] = [Math.min(lastClickedIdx, idx), Math.max(lastClickedIdx, idx)];
        for (let i = a; i <= b; i++) {
          if (cb.checked) S.selected.add(visibleIds[i]); else S.selected.delete(visibleIds[i]);
        }
        render(); return;
      }
      lastClickedIdx = idx;
      if (cb.checked) S.selected.add(it.id); else S.selected.delete(it.id);
      updateBulkbar();
    });
    tr.appendChild(cbTd);
    for (const c of TABLE_COLS) {
      let html;
      switch (c.key) {
        case "sprite": {
          const td = el("td");
          const img = el("img", { class: "sprite", width: 22, height: 22 });
          fillSpriteImg(img, it); td.appendChild(img); tr.appendChild(td); continue;
        }
        case "no": html = `<span class="mono faint">${String(it.no).padStart(3, "0")}</span>`; break;
        case "cost": html = it.ownable ? `<span class="mono">${deriveCost(eff.cost_chip)}</span>` : `<span class="faint">—</span>`; break;
        case "achip": html = eff.corrupt_cost_achip != null ? `<span class="mono" style="color:var(--violet)">${eff.corrupt_cost_achip}</span>` : `<span class="faint">—</span>`; break;
        case "thr": html = it.raw.unlock && it.raw.unlock.threshold != null ? `<span class="mono">${it.raw.unlock.threshold}</span>` : `<span class="faint">—</span>`; break;
        case "tags": html = itemTags(it.id).map(t =>
          `<span class="tagchip" style="border-color:${tagColor(t)};color:${tagColor(t)}">${esc(t)}</span>`).join(" "); break;
        case "flags": html = (isEdited(it.id) ? `<span class="dot edited"></span> ` : "") +
          (S.meta.notes[it.id] ? `<span class="dot note"></span>` : ""); break;
        case "name": html = `<b>${esc(eff.name)}</b>`; break;
        case "fx_text": html = `<span style="color:var(--muted)">${renderIconText(eff.effect_text, 12)}</span>`; break;
        case "id": html = `<span class="mono faint">${esc(it.id)}</span>`; break;
        default: html = esc(String(c.get(it) ?? ""));
      }
      tr.appendChild(el("td", {}, html));
    }
    tr.addEventListener("click", () => openDetail(it.id));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  root.appendChild(table);
  $("#selall").addEventListener("click", (ev) => {
    ev.stopPropagation();
    if (ev.target.checked) visibleIds.forEach(id => S.selected.add(id));
    else S.selected.clear();
    render();
  });
}

function updateBulkbar() {
  const bar = $("#bulkbar");
  if (!S.selected.size || S.ui.tab !== "table") { bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  bar.innerHTML = `<b>${S.selected.size} selected</b>`;
  const addSel = el("select", {}, `<option value="">+ add tag…</option>` +
    S.meta.tags.map(t => `<option>${esc(t.name)}</option>`).join(""));
  addSel.addEventListener("change", () => {
    if (addSel.value) { for (const id of S.selected) assignTag(id, addSel.value, true); render(); }
  });
  const rmSel = el("select", {}, `<option value="">− remove tag…</option>` +
    S.meta.tags.map(t => `<option>${esc(t.name)}</option>`).join(""));
  rmSel.addEventListener("change", () => {
    if (rmSel.value) { for (const id of S.selected) assignTag(id, rmSel.value, false); render(); }
  });
  const clr = el("button", {}, "clear");
  clr.addEventListener("click", () => { S.selected.clear(); render(); });
  bar.append(addSel, rmSel, clr);
}

/* ── Chains view ── */
const CARD_W = 210, CARD_H = 110, GAP_X = 60, GAP_Y = 14, PAD = 16;
function layoutChain(chain) {
  // col = depth; rows assigned by DFS so children sit beside their parent.
  const pos = new Map(); let nextRow = 0;
  const kids = id => (S.model.childrenOf.get(id) || [])
    .slice().sort((a, b) => S.model.byId.get(a).no - S.model.byId.get(b).no);
  function place(id, depth) {
    const children = kids(id);
    if (!children.length) { pos.set(id, { col: depth, row: nextRow++ }); return pos.get(id).row; }
    const rows = children.map(c => place(c, depth + 1));
    const mid = (Math.min(...rows) + Math.max(...rows)) / 2;
    pos.set(id, { col: depth, row: mid });
    return mid;
  }
  place(chain.root, 0);
  return pos;
}
function viewChains(root) {
  const layout = el("div", { id: "chains-layout" });
  const side = el("div", { id: "chains-side" });
  side.appendChild(el("div", { class: "faint", style: "margin-bottom:6px" },
    `${S.model.chains.length} chains · ${S.model.edgeCount} links`));
  const main = el("div", { id: "chains-main" });
  layout.append(side, main);
  root.appendChild(layout);

  for (const chain of S.model.chains) {
    const rootIt = S.model.byId.get(chain.root);
    const jump = el("div", { class: "jump" },
      `${esc(effective(rootIt).name)} <span class="faint">(${chain.members.length})</span>`);
    jump.addEventListener("click", () => locateInChains(chain.root));
    side.appendChild(jump);

    const pos = layoutChain(chain);
    let maxCol = 0, maxRow = 0;
    for (const p of pos.values()) { maxCol = Math.max(maxCol, p.col); maxRow = Math.max(maxRow, p.row); }
    const band = el("div", { class: "chainband", "data-chain": chain.root });
    const W = PAD * 2 + (maxCol + 1) * CARD_W + maxCol * GAP_X;
    const H = PAD * 2 + (maxRow + 1) * (CARD_H + GAP_Y) - GAP_Y;
    const inner = el("div", { class: "cards", style: `width:${W}px;height:${H}px` });
    const xy = (p) => ({ x: PAD + p.col * (CARD_W + GAP_X), y: PAD + p.row * (CARD_H + GAP_Y) });
    // wires under the cards
    let wires = "";
    for (const id of chain.members) {
      const parent = S.model.byId.get(id).raw.requires;
      if (!parent || !pos.has(parent)) continue;
      const a = xy(pos.get(parent)), b = xy(pos.get(id));
      const x1 = a.x + CARD_W, y1 = a.y + CARD_H / 2;
      const x2 = b.x, y2 = b.y + CARD_H / 2;
      const midX = x1 + GAP_X / 2;
      wires += `<path d="M${x1},${y1} H${midX} V${y2} H${x2}" fill="none" stroke="#6B5B49" stroke-width="2"/>`;
    }
    inner.innerHTML = `<svg class="wires" width="${W}" height="${H}">${wires}</svg>`;
    for (const id of chain.members) {
      const p = xy(pos.get(id));
      inner.appendChild(itemCard(S.model.byId.get(id), { abs: true, x: p.x, y: p.y }));
    }
    band.appendChild(inner);
    main.appendChild(band);
  }
  // unchained
  const un = S.model.unchained.map(id => S.model.byId.get(id)).sort((a, b) => a.no - b.no);
  const hdr = el("div", { class: "unchained-hdr" }, `▸ Unchained items (${un.length}) — click to toggle`);
  const grid = el("div", { class: "cardgrid hidden" });
  for (const it of un) grid.appendChild(itemCard(it));
  hdr.addEventListener("click", () => {
    grid.classList.toggle("hidden");
    hdr.textContent = (grid.classList.contains("hidden") ? "▸" : "▾") + ` Unchained items (${un.length}) — click to toggle`;
  });
  main.append(hdr, grid);
}
function locateInChains(id) {
  if (S.ui.tab !== "chains") { S.ui.tab = "chains"; render(); }
  requestAnimationFrame(() => {
    const card = $(`#chains-main .card[data-id="${id}"]`) || $(`#content .card[data-id="${id}"]`);
    if (card) {
      card.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
      card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash");
    }
  });
}
/* ── Stats view ── */
function viewStats(root) {
  const M = S.model;
  const items = M.items;

  // 1. Department rollup
  {
    const blk = el("div", { class: "statblock" });
    blk.appendChild(el("h3", {}, "Departments"));
    let rows = "", gCount = 0, gCost = 0, gAchip = 0, gOwn = 0;
    for (const dept of M.deptOrder) {
      const ids = items.filter(it => M.deptOf.get(it.id) === dept);
      if (!ids.length) continue;
      const own = ids.filter(it => it.ownable).length;
      const cost = ids.reduce((a, it) => a + (it.ownable ? deriveCost(effective(it).cost_chip) : 0), 0);
      const achip = ids.reduce((a, it) => a + (effective(it).corrupt_cost_achip || 0), 0);
      gCount += ids.length; gCost += cost; gAchip += achip; gOwn += own;
      rows += `<tr><td>${esc(dept)}</td><td class="num">${ids.length}</td>` +
        `<td class="num">${own}</td><td class="num">${cost}</td><td class="num">${achip}</td></tr>`;
    }
    rows += `<tr style="font-weight:600"><td>TOTAL</td><td class="num">${gCount}</td>` +
      `<td class="num">${gOwn}</td><td class="num">${gCost}</td><td class="num">${gAchip}</td></tr>`;
    blk.appendChild(el("table", { class: "stat" },
      `<tr><th>department</th><th class="num">items</th><th class="num">ownable</th>` +
      `<th class="num">cost ${chipSvg(11, COLORS.chip, COLORS.chipRing)}</th>` +
      `<th class="num">corrupt ${chipSvg(11, COLORS.achip, COLORS.achipRing)}</th></tr>` + rows));
    blk.appendChild(el("div", { class: "faint", style: "margin-top:6px" },
      "catalog.lua header claims 800 total across bands A–D; ownable count drives shove (1%/item)"));
    root.appendChild(blk);
  }

  // 2. Phase × act matrix
  {
    const blk = el("div", { class: "statblock" });
    blk.appendChild(el("h3", {}, "Phase × Act"));
    const phases = [...new Set(items.map(it => it.raw.phase))];
    let rows = "";
    for (const ph of phases) {
      const a1 = items.filter(it => it.raw.phase === ph && it.raw.act !== 2);
      const a2 = items.filter(it => it.raw.phase === ph && it.raw.act === 2);
      const cost = arr => arr.reduce((a, it) => a + (it.ownable ? deriveCost(effective(it).cost_chip) : 0), 0);
      rows += `<tr><td>${esc(ph)}</td><td class="num">${a1.length} (${cost(a1)})</td>` +
        `<td class="num">${a2.length} (${cost(a2)})</td></tr>`;
    }
    blk.appendChild(el("table", { class: "stat" },
      `<tr><th>phase</th><th class="num">act 1 · (cost)</th><th class="num">act 2 · (cost)</th></tr>` + rows));
    root.appendChild(blk);
  }

  // 3. Cumulative shove curve
  {
    const blk = el("div", { class: "statblock" });
    blk.appendChild(el("h3", {}, "Cumulative shove (flat 1%/item × bankroll mult)"));
    const bar = el("div", { style: "display:flex;gap:6px;align-items:center;margin-bottom:8px" });
    bar.appendChild(el("span", { class: "muted" }, "bankroll:"));
    const inp = el("input", { type: "number", value: S.ui.bankroll, style: "width:110px" });
    inp.addEventListener("change", () => { S.ui.bankroll = Number(inp.value) || 0; render(); });
    bar.appendChild(inp);
    for (const t of BANKROLL_TIERS.slice(1)) {
      const b = el("button", {}, t.label);
      b.addEventListener("click", () => { S.ui.bankroll = t.threshold; render(); });
      bar.appendChild(b);
    }
    blk.appendChild(bar);

    const owned = items.filter(it => it.ownable)
      .slice().sort((a, b) => deriveCost(effective(a).cost_chip) - deriveCost(effective(b).cost_chip));
    const mult = bankrollMult(S.ui.bankroll);
    const W = 640, H = 180, padL = 40, padB = 22;
    let pts = "", to25 = null, to80 = null, spent = 0;
    const spendAt = [];
    for (let n = 0; n <= owned.length; n++) {
      const r1 = shoveR1(n, S.ui.bankroll);
      const x = padL + (W - padL) * (n / owned.length);
      const y = H - padB - (H - padB - 8) * r1;
      pts += `${x},${y} `;
      if (to25 == null && r1 >= 0.25) to25 = n;
      if (to80 == null && r1 >= 0.80) to80 = n;
      if (n < owned.length) { spent += deriveCost(effective(owned[n]).cost_chip); spendAt[n + 1] = spent; }
    }
    const yFor = v => H - padB - (H - padB - 8) * v;
    let svg = `<svg width="${W}" height="${H}" style="background:#191512;border-radius:6px">`;
    for (const v of [0.25, 0.5, 0.8, 0.99]) {
      svg += `<line x1="${padL}" y1="${yFor(v)}" x2="${W}" y2="${yFor(v)}" stroke="#3A332A" stroke-dasharray="4 4"/>` +
        `<text x="4" y="${yFor(v) + 4}" fill="#6B6055" font-size="10">${Math.round(v * 100)}%</text>`;
    }
    svg += `<polyline points="${pts}" fill="none" stroke="${COLORS.chip}" stroke-width="2"/>`;
    svg += `<text x="${padL}" y="${H - 6}" fill="#6B6055" font-size="10">0 items</text>` +
      `<text x="${W - 60}" y="${H - 6}" fill="#6B6055" font-size="10">${owned.length} items</text></svg>`;
    blk.appendChild(el("div", {}, svg));
    const mkRead = (label, n) => n == null ? `${label}: unreachable at this bankroll`
      : `${label}: <b>${n}</b> items (≈${spendAt[n] || 0} ${chipSvg(11, COLORS.chip, COLORS.chipRing)} spent, cheapest-first)`;
    blk.appendChild(el("div", { style: "margin-top:6px" },
      `mult ×${mult.toFixed(2)} — ${mkRead("25% (first shove)", to25)} · ${mkRead("80% (ACT1 target)", to80)}`));
    root.appendChild(blk);
  }

  // 4. Unlock gate timeline
  {
    const blk = el("div", { class: "statblock" });
    blk.appendChild(el("h3", {}, "Unlock gates by counter"));
    const byKind = new Map();
    const flags = [];
    for (const it of items) {
      const u = it.raw.unlock;
      if (!u) continue;
      if (u.threshold == null || UNLOCK_FLAGS.has(u.kind)) { flags.push(it); continue; }
      const key = u.kind + (u.gtype ? `[${u.gtype}]` : "");
      if (!byKind.has(key)) byKind.set(key, []);
      byKind.get(key).push(it);
    }
    for (const [kind, arr] of [...byKind.entries()].sort()) {
      arr.sort((a, b) => a.raw.unlock.threshold - b.raw.unlock.threshold);
      const row = el("div", { class: "gaterow" });
      row.appendChild(el("span", { class: "kind" }, esc(kind)));
      arr.forEach((it, i) => {
        const u = it.raw.unlock;
        const thr = u.format === "money" ? fmtMoney(u.threshold) : u.threshold;
        const stop = el("span", { class: "stop" },
          `<b class="mono">${thr}</b> ${esc(effective(it).name)}${u.mystery ? " <span class='faint'>⁇</span>" : ""}`);
        stop.addEventListener("click", () => openDetail(it.id));
        row.appendChild(stop);
        if (i < arr.length - 1) row.appendChild(el("span", { class: "faint" }, " · "));
      });
      blk.appendChild(row);
    }
    if (flags.length) {
      const row = el("div", { class: "gaterow" });
      row.appendChild(el("span", { class: "kind" }, "flags"));
      row.innerHTML += flags.map(it =>
        `<span>${esc(it.raw.unlock.kind)} → <b>${esc(effective(it).name)}</b></span>`).join(" · ");
      blk.appendChild(row);
    }
    const noGate = items.filter(it => !it.raw.unlock && !it.raw.hidden).length;
    blk.appendChild(el("div", { class: "faint", style: "margin-top:6px" },
      `${noGate} items have no unlock gate (open from the start or gated only by requires)`));
    root.appendChild(blk);
  }

  // 5. Chain costs
  {
    const blk = el("div", { class: "statblock" });
    blk.appendChild(el("h3", {}, "Chains"));
    let rows = "";
    for (const chain of S.model.chains) {
      const cost = chain.members.reduce((a, id) => {
        const it = S.model.byId.get(id);
        return a + (it.ownable ? deriveCost(effective(it).cost_chip) : 0);
      }, 0);
      const depth = Math.max(...chain.members.map(id => S.model.byId.get(id).depth)) + 1;
      rows += `<tr><td>${esc(effective(S.model.byId.get(chain.root)).name)}</td>` +
        `<td class="num">${chain.members.length}</td><td class="num">${depth}</td><td class="num">${cost}</td></tr>`;
    }
    blk.appendChild(el("table", { class: "stat" },
      `<tr><th>root</th><th class="num">items</th><th class="num">depth</th>` +
      `<th class="num">cost ${chipSvg(11, COLORS.chip, COLORS.chipRing)}</th></tr>` + rows));
    root.appendChild(blk);
  }

  // 6. Tag rollup
  if (S.meta.tags.length) {
    const blk = el("div", { class: "statblock" });
    blk.appendChild(el("h3", {}, "Tags"));
    let rows = "";
    for (const t of S.meta.tags) {
      const ids = items.filter(it => itemTags(it.id).includes(t.name));
      const cost = ids.reduce((a, it) => a + (it.ownable ? deriveCost(effective(it).cost_chip) : 0), 0);
      rows += `<tr><td><span class="swatch" style="background:${tagColor(t.name)}"></span> ${esc(t.name)}</td>` +
        `<td class="num">${ids.length}</td><td class="num">${cost}</td></tr>`;
    }
    blk.appendChild(el("table", { class: "stat" },
      `<tr><th>tag</th><th class="num">items</th><th class="num">cost</th></tr>` + rows));
    root.appendChild(blk);
  }
}

/* ══════════════ S10 · Detail panel ══════════════ */
function openDetail(id) {
  S.detailId = id;
  document.body.classList.remove("no-detail");
  renderDetail();
}
function closeDetail() {
  S.detailId = null;
  document.body.classList.add("no-detail");
  $("#detail-panel").classList.add("hidden");
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (!$("#sprite-modal").classList.contains("hidden")) closeSpriteModal();
    else if (!$("#tag-modal").classList.contains("hidden")) $("#tag-modal").classList.add("hidden");
    else closeDetail();
  }
});

function fieldRow(it, field, label, kind) {
  const eff = effective(it);
  const authored = authoredValue(it, field);
  const cur = eff[field];
  const dirty = S.edits[it.id] && field in S.edits[it.id];
  const wrap = el("div", { class: "field" });
  const lab = el("label", {}, esc(label));
  if (dirty) {
    lab.appendChild(el("span", { class: "dot edited" }));
    const rv = el("button", { class: "revert", title: "revert to authored: " + authored }, "⟲");
    rv.addEventListener("click", () => { setEdit(it.id, field, authored); renderDetail(); render(); });
    lab.appendChild(rv);
  }
  wrap.appendChild(lab);
  let inp;
  if (kind === "textarea") { inp = el("textarea", { rows: field === "description" ? 2 : 3 }); inp.value = cur ?? ""; }
  else if (kind === "number") { inp = el("input", { type: "number", min: 0 }); inp.value = cur ?? 0; }
  else { inp = el("input", { type: "text" }); inp.value = cur ?? ""; }
  if (dirty) attachTip(inp, () => `<span class="muted">authored:</span> ${esc(String(authored))}`);
  inp.addEventListener("change", () => {
    setEdit(it.id, field, kind === "number" ? Number(inp.value) : inp.value);
    renderDetail(); render();
  });
  if (field === "effect_text" || field === "corrupt_effect_text") {
    inp.addEventListener("input", () => {
      const pv = wrap.querySelector(".fx-preview");
      if (pv) pv.innerHTML = renderIconText(inp.value, 13);
    });
  }
  wrap.appendChild(inp);
  if (field === "effect_text" || field === "corrupt_effect_text")
    wrap.appendChild(el("div", { class: "fx-preview" }, renderIconText(cur, 13)));
  return wrap;
}

function renderDetail() {
  const panel = $("#detail-panel");
  const it = S.model.byId.get(S.detailId);
  if (!it) { closeDetail(); return; }
  const eff = effective(it);
  panel.classList.remove("hidden");
  panel.innerHTML = "";
  const close = el("button", { class: "close" }, "✕");
  close.addEventListener("click", closeDetail);
  panel.appendChild(close);

  // header
  const head = el("div", { style: "display:flex;gap:12px;align-items:center" });
  const img = el("img", { class: "sprite", width: 64, height: 64 });
  fillSpriteImg(img, it);
  head.appendChild(img);
  const hd = el("div");
  hd.appendChild(el("h2", {}, esc(eff.name)));
  const idline = el("div", { class: "idline", title: "IDS ARE FROZEN — serialized into saves" },
    `No. ${String(it.no).padStart(3, "0")} · id: ${esc(it.id)}`);
  hd.appendChild(idline);
  const bd = el("div", { class: "badges", style: "margin-top:4px" });
  bd.appendChild(el("span", { class: "badge" }, esc(it.raw.phase)));
  if (it.raw.act === 2) bd.appendChild(el("span", { class: "badge act2" }, "ACT 2"));
  bd.appendChild(el("span", { class: "badge" }, esc(S.model.deptOf.get(it.id) || "")));
  if (!it.ownable) bd.appendChild(el("span", { class: "badge sys" }, it.raw.gate ? "GATE" : "SYSTEM"));
  hd.appendChild(bd);
  head.appendChild(hd);
  panel.appendChild(head);

  // sprite change
  const sprRow = el("div", { class: "field" });
  const sprLab = el("label", {}, "sprite");
  const dirtySprite = S.edits[it.id] && "sprite_target" in S.edits[it.id];
  if (dirtySprite) {
    sprLab.appendChild(el("span", { class: "dot edited" }));
    const rv = el("button", { class: "revert" }, "⟲");
    rv.addEventListener("click", () => { setEdit(it.id, "sprite_target", authoredValue(it, "sprite_target")); renderDetail(); render(); });
    sprLab.appendChild(rv);
  }
  sprRow.appendChild(sprLab);
  const sprLine = el("div", { style: "display:flex;gap:8px;align-items:center" });
  sprLine.appendChild(el("span", { class: "mono faint", style: "font-size:10px;overflow-wrap:anywhere" },
    esc(eff.sprite_target || "(none)")));
  const chg = el("button", {}, "Change…");
  chg.addEventListener("click", () => openSpriteModal(it.id));
  sprLine.appendChild(chg);
  sprRow.appendChild(sprLine);
  panel.appendChild(sprRow);

  // editable fields
  panel.appendChild(fieldRow(it, "name", "name", "text"));
  panel.appendChild(fieldRow(it, "description", "flavor", "textarea"));
  panel.appendChild(fieldRow(it, "effect_text", "effect text", "textarea"));
  if (it.ownable) {
    const costWrap = fieldRow(it, "cost_chip", "authored cost (cost_chip)", "number");
    costWrap.appendChild(el("div", { class: "faint", style: "margin-top:2px" },
      `derived in-game: ${deriveCost(eff.cost_chip)} (authored × RUN_MINUTES/20, RUN_MINUTES=${RUN_MINUTES}) · shove +${(K_SHOVE * 100).toFixed(0)}% flat`));
    panel.appendChild(costWrap);

  if (it.raw.corrupt) {

function closeSpriteModal() {

function openSpriteModal(itemId) {
  const veil = $("#sprite-modal"); const box = veil.querySelector(".modal");

  const search = el("input", { type: "search", placeholder: "search path…", style: "width:220px" });
  const folders = [...new Set(S.model.spritePool.map(p => p.split("/").slice(0, -1).join("/")))].sort();
  const fsel = el("select", {}, `<option value="">all folders</option>` +
    folders.map(f => `<option>${esc(f)}</option>`).join(""));
  const aliasedOnly = el("label", { style: "font-size:11px;color:var(--muted)" },
    `<input type="checkbox"> aliased only`);
  bar.append(search, fsel, aliasedOnly);
  box.appendChild(bar);
  const grid = el("div", { id: "sprite-grid" });
  box.appendChild(grid);
  const preview = el("div", { id: "sprite-preview" });
  box.appendChild(preview);
  const actions = el("div", { style: "display:flex;gap:8px;justify-content:flex-end;margin-top:10px" });
  const useBtn = el("button", { class: "primary", disabled: "" }, "Use this sprite");
  const cancel = el("button", {}, "Cancel");
  cancel.addEventListener("click", closeSpriteModal);
  useBtn.addEventListener("click", () => {
    if (picked) { setEdit(itemId, "sprite_target", picked); closeSpriteModal(); renderDetail(); render(); }
  });
  actions.append(cancel, useBtn);
  box.appendChild(actions);

  function refreshGrid() {
    if (spriteObserver) spriteObserver.disconnect();
    grid.innerHTML = "";
    spriteObserver = new IntersectionObserver((entries) => {
      for (const en of entries) {
        if (!en.isIntersecting) continue;
        const cell = en.target;
        spriteObserver.unobserve(cell);
        const rel = "assets/sprites/" + cell.dataset.path + ".png";
        spriteUrl(rel).then(url => {
          if (url) cell.querySelector(".box").innerHTML =
            `<img class="sprite" src="${url}" style="max-width:64px;max-height:64px">`;
        });
      }
    }, { root: grid, rootMargin: "200px" });
    const q = search.value.toLowerCase();
    const folder = fsel.value;
    const onlyAliased = aliasedOnly.querySelector("input").checked;
    let shown = 0;
    for (const p of S.model.spritePool) {
      if (q && !p.toLowerCase().includes(q)) continue;
      if (folder && !p.startsWith(folder + "/")) continue;
      const aliasName = S.model.aliasTargets.get(p);
      if (onlyAliased && !aliasName) continue;
      if (++shown > 1400) break;
      const cell = el("div", { class: "spritecell" + (p === current ? " current" : ""), "data-path": p });
      cell.innerHTML = `<div class="box"></div>${esc(p.split("/").pop())}` +
        (aliasName ? `<div class="alias">= ${esc(aliasName)}</div>` : "");
      cell.addEventListener("click", async () => {
        picked = p;
        useBtn.removeAttribute("disabled");
        $$(".spritecell.current", grid).forEach(c => c.classList.remove("current"));
        cell.classList.add("current");
        const url = await spriteUrl("assets/sprites/" + p + ".png");
        preview.innerHTML = url ? [1, 2, 4].map(s =>
          `<img class="sprite" src="${url}" style="transform-origin:bottom left;image-rendering:pixelated;width:auto;height:auto;zoom:${s}">`)
          .join("") + `<span class="mono faint" style="font-size:10px">${esc(p)}</span>` : "";
      });
      grid.appendChild(cell);
      spriteObserver.observe(cell);
    }
    if (!shown) grid.innerHTML = `<div class="faint" style="padding:20px">no sprites match</div>`;
  }
  search.addEventListener("input", debounce(refreshGrid, 200));
  fsel.addEventListener("change", refreshGrid);
  aliasedOnly.querySelector("input").addEventListener("change", refreshGrid);
  refreshGrid();
}

function buildExport() {
  const out = { tool: "catalog_designer", version: 1, exported_at: nowIso(),
    source: { item_count: S.model.items.length, run_minutes: RUN_MINUTES },
    edits: {} };
  for (const [id, fields] of Object.entries(S.edits)) {
    const it = S.model.byId.get(id);
    if (!it) continue;
    const entry = {};
    for (const [field, to] of Object.entries(fields)) {
      if (field === "sprite_target") {
        entry.sprite = {
          from_alias: it.raw.sprite || null,
          from_target: authoredValue(it, "sprite_target"),
          to_target: to,
          apply: "repoint aliases.json alias at to_target; catalog.lua sprite field unchanged",
        };
      } else {
        entry[field] = { from: authoredValue(it, field), to };
      }
    }
    if (Object.keys(entry).length) out.edits[id] = entry;
  }
  return out;
}
function doExport() {
  const data = buildExport();
  const n = Object.keys(data.edits).length;
  if (!n) { alert("No staged edits. (Tags and notes live in tools/catalog_meta.json, not the export.)"); return; }
  download(`catalog_edits_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 2));
}
function doImport(file) {
  file.text().then(text => {
    let j;
    try { j = JSON.parse(text); } catch (e) { return alert("Not valid JSON: " + e.message); }
    const veil = $("#import-modal"); const box = veil.querySelector(".modal");
    const isMeta = j.tags !== undefined || j.assignments !== undefined;
    const isEdits = j.edits !== undefined;
    if (!isMeta && !isEdits) return alert("Unrecognized file (expected an edits export or a catalog_meta.json).");
    veil.classList.remove("hidden");
    box.innerHTML = `<h3>Import ${isMeta ? "meta (tags + notes)" : "staged edits"}</h3>` +
      `<p class="muted">${isMeta
        ? `${(j.tags || []).length} tags, ${Object.keys(j.assignments || {}).length} tagged items, ${Object.keys(j.notes || {}).length} notes`
        : `${Object.keys(j.edits || {}).length} edited items`}</p>`;
    const row = el("div", { style: "display:flex;gap:8px;justify-content:flex-end" });
    const merge = el("button", { class: "primary" }, "Merge");
    const replace = el("button", {}, "Replace");
    const cancel = el("button", {}, "Cancel");
    cancel.addEventListener("click", () => veil.classList.add("hidden"));
    function apply(mode) {
      if (isMeta) {
        if (mode === "replace") S.meta = Object.assign(emptyMeta(), j);
        else {
          for (const t of (j.tags || [])) if (!tagDef(t.name)) S.meta.tags.push(t);
          Object.assign(S.meta.assignments, j.assignments || {});
          Object.assign(S.meta.notes, j.notes || {});
        }
        metaChanged();
      } else {
        const imported = {};
        for (const [id, fields] of Object.entries(j.edits || {})) {
          imported[id] = {};
          for (const [f, v] of Object.entries(fields)) {
            if (f === "sprite") imported[id].sprite_target = v.to_target;
            else imported[id][f] = (v && typeof v === "object" && "to" in v) ? v.to : v;
          }
        }
        if (mode === "replace") S.edits = imported;
        else for (const [id, fields] of Object.entries(imported))
          S.edits[id] = Object.assign(S.edits[id] || {}, fields);
        lsSet(LS_EDITS, { version: 1, edits: S.edits });
      }
      veil.classList.add("hidden");
      render(); if (S.detailId) renderDetail();
    }
    merge.addEventListener("click", () => apply("merge"));
    replace.addEventListener("click", () => apply("replace"));
    row.append(cancel, replace, merge);
    box.appendChild(row);
  });
}

/* ══════════════ S15 · Sim engine (fengari — runs the game's own Lua) ══════════════ */
// The math is NOT reimplemented here. tools/sim_bridge.lua orchestrates the
// game's models/outcome_math.lua + models/poker_effects.lua inside a fengari
// Lua state fed from the picked folder, so balance edits to the game flow
// into the sim on the next folder load. Headless-verified against golden
// vectors in the session that built this (see tools/sim_bridge.lua header
// for the three tiny mirrored functions and their game-side sources).
const ENGINE = { ok: false, err: null, booting: false };
// Keep in sync with the `require` list at the top of tools/sim_bridge.lua
// (the bridge is loaded separately, so its own requires aren't auto-scanned).
const LUA_SEEDS = ["models.poker_effects", "models.outcome_math", "models.shove_rate",
  "services.EffectsRegistry", "utils.lookups", "data.stakes", "data.game_types",
  "data.pot_tiers", "data.bankroll_tiers", "data.constants", "data.mtt_finish_dist",
  "data.mtt_payouts", "data.mtt_hand_count", "data.run_upgrades", "data.effects",
  "data.catalog", "data.catalog_pages", "data.procs", "data.routers", "data.balance"];
// Script-only seconds per hand from sim/gtype_ev.lua runs (±20% by tier mix).
const SEC_PER_HAND = { six_max: 17.0, hu: 6.2, zoom: 2.2, mtt: 18.4 };

async function collectLuaSources() {
  const map = new Map(); const queue = [...LUA_SEEDS];
  while (queue.length) {
    const mod = queue.pop();
    if (map.has(mod)) continue;
    const rel = mod.replace(/\./g, "/") + ".lua";
    const src = await readText(rel);
    if (src == null) throw new Error("missing " + rel + " in the picked folder");
    map.set(mod, src);
    for (const m of src.matchAll(/require\(\s*["']([\w.]+)["']\s*\)/g)) queue.push(m[1]);
  }
  const jsonSrc = await readText("tools/vendor/json.lua");
  if (jsonSrc == null) throw new Error("missing tools/vendor/json.lua");
  map.set("json", jsonSrc);
  return map;
}

async function bootEngine() {
  if (ENGINE.ok || ENGINE.booting) return;
  ENGINE.booting = true; ENGINE.err = null;
  try {
    if (typeof fengari === "undefined")
      throw new Error("tools/vendor/fengari-web.js is missing — the Sim tab needs it. " +
        "Restore it from git or download fengari-web 0.1.4 into tools/vendor/.");
    const { lua, lauxlib, lualib, to_luastring, to_jsstring } = fengari;
    const L = lauxlib.luaL_newstate();
    lualib.luaL_openlibs(L);
    const sources = await collectLuaSources();
    lua.lua_getglobal(L, to_luastring("package"));
    lua.lua_getfield(L, -1, to_luastring("preload"));
    for (const [mod, src] of sources) {
      const st = lauxlib.luaL_loadbuffer(L, to_luastring(src), src.length, to_luastring("@" + mod));
      if (st !== lua.LUA_OK)
        throw new Error(mod + ": " + to_jsstring(lua.lua_tolstring(L, -1)));
      lua.lua_setfield(L, -2, to_luastring(mod));
    }
    lua.lua_pop(L, 2);
    const bridgeSrc = await readText("tools/sim_bridge.lua");
    if (bridgeSrc == null) throw new Error("missing tools/sim_bridge.lua");
    let st = lauxlib.luaL_loadbuffer(L, to_luastring(bridgeSrc), bridgeSrc.length, to_luastring("@sim_bridge"));
    if (st !== lua.LUA_OK) throw new Error("bridge: " + to_jsstring(lua.lua_tolstring(L, -1)));
    st = lua.lua_pcall(L, 0, 1, 0);
    if (st !== lua.LUA_OK) throw new Error("bridge: " + to_jsstring(lua.lua_tolstring(L, -1)));
    lua.lua_pop(L, 1);
    ENGINE.L = L; ENGINE.lua = lua; ENGINE.to_luastring = to_luastring;
    ENGINE.to_jsstring = to_jsstring;
    ENGINE.info = callBridge("info", {});
    ENGINE.ok = true;
  } catch (e) {
    ENGINE.err = String(e.message || e);
  } finally {
    ENGINE.booting = false;
    if (S.ui.tab === "sim") render();
  }
}

function callBridge(fn, arg) {
  const { L, lua, to_luastring, to_jsstring } = ENGINE;
  lua.lua_getglobal(L, to_luastring("Bridge"));
  lua.lua_getfield(L, -1, to_luastring(fn));
  lua.lua_remove(L, -2);
  lua.lua_pushstring(L, to_luastring(JSON.stringify(arg)));
  const st = lua.lua_pcall(L, 1, 1, 0);
  if (st !== lua.LUA_OK) {
    const e = to_jsstring(lua.lua_tolstring(L, -1));
    lua.lua_pop(L, 1);
    throw new Error(fn + ": " + e);
  }
  const out = to_jsstring(lua.lua_tolstring(L, -1));
  lua.lua_pop(L, 1);
  return JSON.parse(out);
}

/* ── coverage classification (which effects the analytic EV sees) ── */
const MODELED_KINDS = new Set(["win_chance_shift", "wc_mult", "earnings_mult", "loss_mult",
  "win_dist_shift", "loss_dist_shift", "win_tier_shift", "loss_tier_shift", "jackpot_mult",
  "tier_bump_chance", "payout_double_chance", "earnings_per_tier", "earnings_scale_by_bankroll",
  "win_tier_floor", "loss_tier_ceiling", "auto_win_chance", "win_chance_fill", "win_dist_fill",
  "loss_dist_fill", "fill_window_widen", "fill_cascade", "run_upgrade_strength_mult",
  "run_upgrade_bonus_levels", "mtt_payout_boost", "focus_capacity_add",
  "focus_penalty_reduce_mult", "focus_penalty_immune", "solo_table_bonus", "corner_win_chance"]);
const THROUGHPUT_KINDS = new Set(["hand_pace_mult", "solo_table_pace"]);
function simCoverage(it, corrupted) {
  const effects = (corrupted && it.raw.corrupt && it.raw.corrupt.effects)
    ? it.raw.corrupt.effects : (it.raw.effects || []);
  const kinds = effects.map(e => e.kind).filter(k => k !== "shove_rate_add");
  if (!kinds.length) return { cls: "none", label: "inert" };
  const modeled = kinds.filter(k => MODELED_KINDS.has(k)).length;
  const thru = kinds.filter(k => THROUGHPUT_KINDS.has(k)).length;
  if (modeled === kinds.length) return { cls: "full", label: "modeled" };
  if (modeled + thru === kinds.length) return { cls: "full", label: "$/hr" };
  if (modeled + thru > 0) return { cls: "part", label: "partial" };
  return { cls: "none", label: "not modeled" };
}

function simRequest(equipped, corrupted) {
  const s = S.ui.sim;
  return {
    equipped: equipped ?? s.equipped, corrupted: corrupted ?? s.corrupted,
    upgrades: s.upgrades, stake_id: s.stake_id, gtype_id: s.gtype_id,
    transient: { active_tables_count: Number(s.tables) || 1 },
    opts: { bankroll: Number(s.bankroll) || 0, use_focus: !!s.useFocus, corner: !!s.corner },
  };
}
function baselineRequest() {
  const s = S.ui.sim;
  if (s.baseline !== "naked" && S.meta.loadouts[s.baseline]) {
    const lo = S.meta.loadouts[s.baseline];
    const req = simRequest(lo.equipped || [], lo.corrupted || []);
    req.upgrades = lo.upgrades || {};
    return req;
  }
  const req = simRequest([], []);
  if (s.baseline === "naked") req.upgrades = {};
  return req;
}
function dollarsPerHour(ev, gtypeId, paceMult) {
  const base = SEC_PER_HAND[gtypeId] || 10;
  const overhead = gtypeId === "mtt" ? 0 : (Number(S.ui.sim.overhead) || 0);
  const sec = base / (paceMult || 1) + overhead;
  return ev * 3600 / sec;
}

/* ══════════════ S16 · Sim view ══════════════ */
const simRecompute = debounce(() => { if (S.ui.tab === "sim") render(); }, 150);

function viewSim(root) {
  const s = S.ui.sim;
  if (!ENGINE.ok) {
    root.appendChild(el("div", { class: "statblock" }, ENGINE.err
      ? `<h3>Sim engine failed</h3><div class="muted" style="white-space:pre-wrap">${esc(ENGINE.err)}</div>`
      : `<h3>Sim engine loading…</h3><div class="muted">Booting the game's Lua (fengari)…</div>`));
    if (!ENGINE.err && !ENGINE.booting) bootEngine();
    return;
  }

  /* ── scenario bar ── */
  const bar = el("div", { id: "sim-scenario" });
  const stakeSel = el("select", {}, ENGINE.info.stakes.map(st =>
    `<option value="${st.id}" ${st.id === s.stake_id ? "selected" : ""}>${esc(st.display_name)} (${esc(st.band)})</option>`).join(""));
  stakeSel.addEventListener("change", () => { s.stake_id = stakeSel.value; render(); });
  const gtSel = el("select", {}, ENGINE.info.gtypes.map(g =>
    `<option value="${g.id}" ${g.id === s.gtype_id ? "selected" : ""}>${esc(g.name)}</option>`).join(""));
  gtSel.addEventListener("change", () => { s.gtype_id = gtSel.value; render(); });
  bar.append(stakeSel, gtSel);

  const num = (label, key, step) => {
    const l = el("label", {}, esc(label) + " ");
    const i = el("input", { type: "number", value: s[key], step: step || 1 });
    i.addEventListener("change", () => { s[key] = Number(i.value); render(); });
    l.appendChild(i); return l;
  };
  bar.appendChild(num("bankroll $", "bankroll"));
  bar.appendChild(num("tables", "tables"));
  const chk = (label, key, title) => {
    const l = el("label", { title: title || "" });
    const i = el("input", { type: "checkbox" });
    i.checked = !!s[key];
    i.addEventListener("change", () => { s[key] = i.checked; render(); });
    l.append(i, document.createTextNode(" " + label)); return l;
  };
  bar.appendChild(chk("focus penalty", "useFocus", "apply the over-capacity focus multiplier at this table count"));
  bar.appendChild(chk("corner table", "corner", "Red Rug's corner_win_chance (slot 0 only in game)"));
  bar.appendChild(num("cursor ovh s", "overhead", 0.5));

  for (const u of ENGINE.info.upgrades) {
    const dial = el("span", { class: "upg-dial" });
    dial.appendChild(el("span", { class: "muted" }, esc(u.name)));
    const r = el("input", { type: "range", min: 0, max: u.max_level, value: s.upgrades[u.id] || 0 });
    const lvl = el("span", { class: "lvl" }, String(s.upgrades[u.id] || 0));
    r.addEventListener("input", () => {
      s.upgrades[u.id] = Number(r.value); lvl.textContent = r.value; simRecompute();
    });
    dial.append(r, lvl);
    bar.appendChild(dial);
  }
  root.appendChild(bar);

  /* ── layout: loadout | results ── */
  const layout = el("div", { id: "sim-layout" });
  root.appendChild(layout);
  const left = el("div", { id: "sim-loadout" });
  const main = el("div", { id: "sim-main" });
  layout.append(left, main);

  /* ── loadout panel ── */
  const equipped = new Set(s.equipped);
  const corrupted = new Set(s.corrupted);
  const lctl = el("div", { style: "display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap" });
  const search = el("input", { type: "search", placeholder: "filter…", style: "flex:1;min-width:90px" });
  search.value = s.search || "";
  search.addEventListener("input", debounce(() => { s.search = search.value; render(); }, 200));
  lctl.appendChild(search);
  const presets = [
    ["none", () => []],
    ["all modeled", () => S.model.items.filter(it => !it.raw.hidden && it.ownable &&
        simCoverage(it, false).cls === "full").map(it => it.id)],
    ["all", () => S.model.items.filter(it => !it.raw.hidden && it.ownable).map(it => it.id)],
  ];
  for (const [name, fn] of presets) {
    const b = el("button", { style: "font-size:10px;padding:2px 6px" }, esc(name));
    b.addEventListener("click", () => { s.equipped = fn(); render(); });
    lctl.appendChild(b);
  }
  left.appendChild(lctl);

  // loadout save/load (persisted in tools/catalog_meta.json)
  const lrow = el("div", { style: "display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center" });
  const loSel = el("select", {}, `<option value="naked">baseline: naked</option>` +
    Object.keys(S.meta.loadouts).sort().map(n =>
      `<option value="${esc(n)}" ${n === s.baseline ? "selected" : ""}>baseline: ${esc(n)}</option>`).join(""));
  loSel.value = S.meta.loadouts[s.baseline] ? s.baseline : "naked";
  loSel.addEventListener("change", () => { s.baseline = loSel.value; render(); });
  lrow.appendChild(loSel);
  const saveB = el("button", { style: "font-size:10px" }, "save loadout…");
  saveB.addEventListener("click", () => {
    const name = prompt("Loadout name:");
    if (!name) return;
    S.meta.loadouts[name] = { equipped: [...equipped], corrupted: [...corrupted],
      upgrades: { ...s.upgrades } };
    metaChanged(); render();
  });
  lrow.appendChild(saveB);
  const loadB = el("button", { style: "font-size:10px" }, "load…");
  loadB.addEventListener("click", () => {
    const names = Object.keys(S.meta.loadouts).sort();
    if (!names.length) return alert("No saved loadouts yet.");
    const name = prompt("Load which loadout?\n" + names.join(", "));
    const lo = name && S.meta.loadouts[name];
    if (!lo) return;
    s.equipped = [...(lo.equipped || [])]; s.corrupted = [...(lo.corrupted || [])];
    s.upgrades = { ...(lo.upgrades || {}) };
    render();
  });
  lrow.appendChild(loadB);
  left.appendChild(lrow);

  const list = el("div", { id: "sim-items" });
  const q = (s.search || "").toLowerCase();
  for (const it of S.model.items) {
    if (it.raw.hidden || !it.ownable) continue;
    const eff = effective(it);
    if (q && !(it.id + " " + eff.name).toLowerCase().includes(q)) continue;
    const row = el("div", { class: "sim-item" });
    const eq = el("input", { type: "checkbox", title: "equip" });
    eq.checked = equipped.has(it.id);
    eq.addEventListener("change", () => {
      if (eq.checked) equipped.add(it.id); else equipped.delete(it.id);
      s.equipped = [...equipped]; simRecompute();
    });
    row.appendChild(eq);
    const co = el("input", { type: "checkbox", class: "corrupt-cb", title: "corrupted (replaces effects)" });
    if (!it.raw.corrupt) co.style.visibility = "hidden";
    co.checked = corrupted.has(it.id);
    co.addEventListener("change", () => {
      if (co.checked) corrupted.add(it.id); else corrupted.delete(it.id);
      s.corrupted = [...corrupted]; simRecompute();
    });
    row.appendChild(co);
    const nm = el("span", { class: "nm", title: eff.effect_text || "" }, esc(eff.name));
    nm.addEventListener("click", () => openDetail(it.id));
    row.appendChild(nm);
    row.appendChild(el("span", { class: "cost" }, String(deriveCost(eff.cost_chip))));
    const cov = simCoverage(it, corrupted.has(it.id));
    row.appendChild(el("span", { class: "cov " + cov.cls }, esc(cov.label)));
    list.appendChild(row);
  }
  left.appendChild(list);
  left.appendChild(el("div", { class: "faint", style: "font-size:10px;margin-top:4px" },
    "purple box = corrupted (replaces base effects) · coverage: what the analytic EV sees"));

  /* ── results ── */
  let cur, base, err = null;
  try {
    cur = callBridge("eval", simRequest());
    base = callBridge("eval", baselineRequest());
  } catch (e) { err = String(e.message || e); }
  if (err) {
    main.appendChild(el("div", { class: "statblock" },
      `<h3>Eval failed</h3><div class="muted">${esc(err)}</div>`));
    return;
  }

  const gtypeId = s.gtype_id;
  const isMtt = !!cur.mtt;
  const fmt = (v, d) => v == null ? "—" : Number(v).toFixed(d == null ? 4 : d);
  const pct = v => v == null ? "—" : (v * 100).toFixed(2) + "%";
  const money = v => (v < 0 ? "-$" : "$") + Math.abs(v).toFixed(Math.abs(v) < 10 ? 4 : 2);
  const distBar = (d, ramp) => {
    const keys = ["small", "medium", "large", "jackpot"];
    return `<span class="distbar">` + keys.map(k =>
      `<span style="width:${(d[k] || 0) * 100}%;background:${ramp[k]}" title="${k} ${(d[k] * 100 || 0).toFixed(1)}%"></span>`).join("") + `</span>`;
  };
  const dRow = (label, b, c, fmtFn, goodUp) => {
    if (b == null && c == null) return "";
    const delta = (c != null && b != null) ? c - b : null;
    const cls = delta == null || Math.abs(delta) < 1e-9 ? "" :
      ((delta > 0) === (goodUp !== false) ? "delta-pos" : "delta-neg");
    return `<tr><td>${label}</td><td>${fmtFn(b)}</td><td>${fmtFn(c)}</td>` +
      `<td class="${cls}">${delta == null ? "—" : (delta >= 0 ? "+" : "") + fmtFn(delta)}</td></tr>`;
  };

  const res = el("div", { class: "statblock" });
  const baseName = S.meta.loadouts[s.baseline] ? s.baseline : "naked";
  res.appendChild(el("h3", {}, `Prediction — ${esc(stakeSel.selectedOptions[0].text)} · ${esc(gtSel.selectedOptions[0].text)}` +
    ` <small class="faint">(engine: live game Lua)</small>`));
  let rows = "";
  const wcLabel = "win chance" + (cur.corner_add ? ` <span class="faint">(+corner)</span>` : "");
  rows += dRow(wcLabel, base.wc + (base.corner_add || 0), cur.wc + (cur.corner_add || 0), pct, true);
  rows += `<tr><td>win dist</td><td>${distBar(base.wd, COLORS.tierWin)}</td>` +
    `<td>${distBar(cur.wd, COLORS.tierWin)}</td><td></td></tr>`;
  rows += `<tr><td>loss dist</td><td>${distBar(base.ld, COLORS.tierLoss)}</td>` +
    `<td>${distBar(cur.ld, COLORS.tierLoss)}</td><td></td></tr>`;
  rows += dRow("stack odds / hand", base.stack_pct, cur.stack_pct, v => fmt(v, 3) + "%", true);
  rows += dRow("loss-stack odds", base.loss_stack_pct, cur.loss_stack_pct, v => fmt(v, 3) + "%", false);
  if (!isMtt) {
    rows += dRow("avg win (bb)", base.win_avg_bb, cur.win_avg_bb, v => fmt(v, 2), true);
    rows += dRow("avg loss (bb)", base.loss_avg_bb, cur.loss_avg_bb, v => fmt(v, 2), false);
  }
  rows += dRow("$ / hand", base.ev_per_hand, cur.ev_per_hand, money, true);
  rows += dRow("ev (bb)", base.ev_bb, cur.ev_bb, v => fmt(v, 3), true);
  rows += dRow("$ / hour ≈", dollarsPerHour(base.ev_per_hand, gtypeId, base.hand_pace_mult),
    dollarsPerHour(cur.ev_per_hand, gtypeId, cur.hand_pace_mult), money, true);
  if (isMtt) {
    rows += dRow("ROI %", base.mtt && base.mtt.roi_pct, cur.mtt.roi_pct, v => fmt(v, 1) + "%", true);
    rows += dRow("net $ / tournament", base.mtt && base.mtt.net_ev_run, cur.mtt.net_ev_run, money, true);
    rows += dRow("hands / tournament", base.mtt && base.mtt.exp_hands, cur.mtt.exp_hands, v => fmt(v, 1), false);
  }
  const shovePctOf = req => (shoveR1(req.equipped.length, Number(s.bankroll) || 0) * 100).toFixed(1) + "%";
  rows += `<tr><td>shove % (flat 1%/item)</td><td>${shovePctOf(baselineRequest())}</td>` +
    `<td>${shovePctOf(simRequest())}</td><td></td></tr>`;
  res.appendChild(el("table", { class: "simres" },
    `<tr><th></th><th>baseline (${esc(baseName)})</th><th>loadout (${equipped.size} items)</th><th>Δ</th></tr>` + rows));
  if (cur.focus_mult != null && cur.focus_mult < 1)
    res.appendChild(el("div", { class: "faint", style: "margin-top:4px" },
      `focus multiplier ×${cur.focus_mult.toFixed(2)} applied at ${s.tables} tables`));
  res.appendChild(el("div", { class: "faint", style: "margin-top:4px" },
    `$/hour is ±20% (fixed sec/hand table ÷ pace + cursor overhead; tier mix shifts real hand length)`));
  main.appendChild(res);

  /* ── marginal value table ── */
  let marg = null;
  try { marg = callBridge("marginals", simRequest()); } catch (e) { /* shown below */ }
  const mblk = el("div", { class: "statblock" });
  mblk.appendChild(el("h3", {}, "Marginal value — Δ$/hand vs the current loadout" +
    ` <small class="faint">(equipped rows: value lost by removing; others: value gained by adding)</small>`));
  if (!marg) {
    mblk.appendChild(el("div", { class: "muted" }, "marginals failed"));
  } else {
    const rowsD = [];
    for (const r of marg.rows) {
      const it = S.model.byId.get(r.id);
      if (!it || !it.ownable) continue;
      const cost = deriveCost(effective(it).cost_chip) || 1;
      rowsD.push({
        id: r.id, name: effective(it).name, equipped: r.equipped,
        dev: r.delta_ev ?? 0, dstack: r.delta_stack ?? 0,
        cost, perchip: (r.delta_ev ?? 0) / cost,
        cov: simCoverage(it, corrupted.has(r.id)),
      });
    }
    const sortKey = s.margSort || "perchip";
    rowsD.sort((a, b) => (b[sortKey] ?? 0) - (a[sortKey] ?? 0));
    const mth = (label, key) => `<th style="cursor:pointer" data-sort="${key}" ` +
      `class="${sortKey === key ? "sorted" : ""}">${label}${sortKey === key ? " ▼" : ""}</th>`;
    const tbl = el("table", { class: "simres", id: "sim-marg" },
      `<tr><th>item</th>${mth("Δ$/hand", "dev")}${mth("cost", "cost")}` +
      `${mth("Δ$/hand per chip", "perchip")}${mth("Δstack%", "dstack")}<th>coverage</th><th></th></tr>` +
      rowsD.map(r =>
        `<tr data-id="${esc(r.id)}"><td style="text-align:left">${esc(r.name)}</td>` +
        `<td class="${r.dev > 1e-9 ? "delta-pos" : r.dev < -1e-9 ? "delta-neg" : ""}">${(r.dev >= 0 ? "+" : "") + r.dev.toFixed(4)}</td>` +
        `<td>${r.cost}</td>` +
        `<td class="${r.perchip > 1e-9 ? "delta-pos" : ""}">${(r.perchip >= 0 ? "+" : "") + r.perchip.toFixed(5)}</td>` +
        `<td>${(r.dstack >= 0 ? "+" : "") + r.dstack.toFixed(3)}</td>` +
        `<td><span class="cov ${r.cov.cls}">${esc(r.cov.label)}</span></td>` +
        `<td>${r.equipped ? "equipped" : ""}</td></tr>`).join(""));
    tbl.addEventListener("click", (ev) => {
      const th = ev.target.closest("th[data-sort]");
      if (th) { s.margSort = th.dataset.sort; render(); return; }
      const tr = ev.target.closest("tr[data-id]");
      if (tr) openDetail(tr.dataset.id);
    });
    mblk.appendChild(tbl);
    mblk.appendChild(el("div", { class: "faint", style: "margin-top:4px" },
      `"not modeled" items show Δ0 here by definition — their value is procs/economy the analytic EV can't see, not that they're worthless.`));
  }
  main.appendChild(mblk);

  /* ── chip sweep estimator ── */
  const sw = el("div", { class: "statblock" });
  sw.appendChild(el("h3", {}, "Chip sweep — bounty per lane (assumes each lane hits its jackpot)"));
  s.lanes = s.lanes || {};
  const grid = el("table", { class: "stat" });
  let hdr = "<tr><th></th>";
  for (const g of ENGINE.info.gtypes) hdr += `<th>${esc(g.name)}</th>`;
  grid.innerHTML = hdr + "</tr>";
  for (const st of ENGINE.info.stakes) {
    const tr = el("tr", {}, `<td>${esc(st.display_name)}</td>`);
    for (const g of ENGINE.info.gtypes) {
      const key = st.id + "/" + g.id;
      const td = el("td", { class: "num" });
      const cb = el("input", { type: "checkbox" });
      cb.checked = !!s.lanes[key];
      cb.addEventListener("change", () => { s.lanes[key] = cb.checked || undefined; simRecompute(); });
      td.appendChild(cb);
      tr.appendChild(td);
    }
    grid.appendChild(tr);
  }
  sw.appendChild(grid);
  const laneList = Object.keys(s.lanes).filter(k => s.lanes[k])
    .map(k => { const [a, b] = k.split("/"); return { stake_id: a, gtype_id: b }; });
  if (laneList.length) {
    try {
      const bres = callBridge("bounty", Object.assign(simRequest(), { lanes: laneList }));
      let total = 0, lines = "";
      for (const l of bres.lanes) {
        total += l.award;
        const secs = l.hands_to_jp != null
          ? l.hands_to_jp * (SEC_PER_HAND[l.gtype_id] || 10) : null;
        lines += `<tr><td>${esc(l.stake_id)}/${esc(l.gtype_id)}</td>` +
          `<td class="num">${l.award}</td>` +
          `<td class="num">${l.hands_to_jp ? l.hands_to_jp.toFixed(0) : "∞"}</td>` +
          `<td class="num">${secs != null ? (secs / 60).toFixed(1) + " min" : "—"}</td></tr>`;
      }
      total += bres.first_bounty_bonus || 0;
      sw.appendChild(el("table", { class: "stat", style: "margin-top:8px" },
        `<tr><th>lane</th><th class="num">bounty</th><th class="num">hands to jackpot</th><th class="num">≈time</th></tr>` +
        lines + `<tr style="font-weight:600"><td>TOTAL</td><td class="num">${total} ${chipSvg(11, COLORS.chip, COLORS.chipRing)}</td>` +
        `<td colspan="2" class="faint">${bres.first_bounty_bonus ? "+" + bres.first_bounty_bonus + " first-bounty bonus included" : ""}</td></tr>`));
    } catch (e) {
      sw.appendChild(el("div", { class: "muted" }, esc(String(e.message || e))));
    }
  }
  main.appendChild(sw);
}

// restore a previously granted directory handle (one-click reopen)
(async () => {
  if (!FS_OK) return;
  try {
    const h = await idbGet("projectDir");
    if (!h) return;
    const perm = await h.queryPermission({ mode: "readwrite" });
    if (perm === "granted") { await openFromHandle(h); return; }
    if (perm === "prompt") {
      $("#reopen-row").classList.remove("hidden");
      const btn = $("#btn-reopen");
      btn.textContent = `Reopen "${h.name}"`;
      btn.addEventListener("click", async () => {
        const p = await h.requestPermission({ mode: "readwrite" });
        if (p === "granted") await openFromHandle(h);
      });
    }
  } catch (e) { /* fresh start */ }
})();
