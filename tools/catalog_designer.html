<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog Designer — poker-idle</title>
<!--
  Standalone catalog visualizer/editor for data/catalog.lua.

  HOW TO USE: open this file in Chrome/Edge (file:// is fine), click
  "Open project folder" and pick the poker-idle repo root. The tool
  parses data/catalog.lua + friends live.

  WRITE BOUNDARY: the tool writes exactly ONE file — tools/catalog_meta.json
  (tags + notes; the game never reads it). Game-data edits (name, cost,
  copy, sprite) are staged locally and leave only via "Export edits"
  as a from/to JSON handed to Claude to apply to data/catalog.lua and
  assets/sprites/aliases.json by hand. This tool NEVER writes game files.

  Colors are hardcoded from data/theme.lua (grind palette: tier.win/loss
  lines 118-129, Theme.currency lines 224-227). Cost/shove derivations
  mirror models/catalog_loader.lua and models/shove_rate.lua.
-->
<style>
:root {
  --bg: #1E1A17; --panel: #26211C; --card: #2E2822; --card-hi: #383026;
  --border: #453B31; --border-hi: #6B5B49;
  --fg: #EBE1D6; --muted: #9C8F82; --faint: #6B6055;
  --gold: #EDBF4D; --gold-dim: #856624;
  --achip: #A659F2;
  --blue: #73A6D9; --violet: #BF73F2;
  --good: #73D973; --warn: #F2B333; --err: #F25252;
  --note: #73A6D9; --edited: #F2B333;
  --mono: Consolas, "Cascadia Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
  font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
button { font: inherit; color: var(--fg); background: var(--card);
  border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--card-hi); border-color: var(--border-hi); }
button.primary { background: #4A3B1E; border-color: var(--gold-dim); color: var(--gold); }
button.primary:hover { background: #5C4A26; }
button.danger { color: var(--err); }
input[type=text], input[type=number], input[type=search], select, textarea {
  font: inherit; color: var(--fg); background: #191512; border: 1px solid var(--border);
  border-radius: 4px; padding: 4px 8px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold-dim); }
textarea { width: 100%; resize: vertical; font-family: inherit; }
img.sprite { image-rendering: pixelated; }
.hidden { display: none !important; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }

/* ── Header ── */
#header { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
  background: var(--panel); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 40; }
#header h1 { font-size: 15px; margin: 0; color: var(--gold); font-weight: 600; }
#header .spacer { flex: 1; }
#save-pill { font-size: 11px; padding: 2px 10px; border-radius: 10px;
  border: 1px solid var(--border); color: var(--muted); }
#save-pill.saved  { color: var(--good); border-color: #2E4A2E; }
#save-pill.saving { color: var(--warn); border-color: #4A3E1E; }
#save-pill.failed { color: var(--err);  border-color: #4A1E1E; cursor: pointer; }
#save-pill.readonly { color: var(--muted); }

/* ── Picker zone ── */
#picker-zone { margin: 40px auto; max-width: 620px; text-align: center;
  border: 2px dashed var(--border); border-radius: 10px; padding: 40px 30px;
  background: var(--panel); }
#picker-zone.dragover { border-color: var(--gold); background: #2E2820; }
#picker-zone h2 { margin-top: 0; color: var(--gold); }
#picker-zone .or { margin: 14px 0 10px; color: var(--faint); }
#picker-err { color: var(--err); margin-top: 12px; white-space: pre-wrap; }
#reopen-row { margin-bottom: 18px; }
#status-strip { display: none; padding: 4px 14px; font-size: 11px; color: var(--muted);
  background: #191512; border-bottom: 1px solid var(--border); }
#status-strip .warn { color: var(--warn); }
#status-strip b { color: var(--fg); font-weight: 600; }

/* ── Global bar + tabs ── */
#global-bar { display: none; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
#global-bar input[type=search] { width: 200px; }
#global-bar .tagchips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
#tab-bar { display: none; gap: 2px; padding: 8px 14px 0; background: var(--panel);
  border-bottom: 1px solid var(--border); }
#tab-bar button { border-radius: 6px 6px 0 0; border-bottom: none;
  background: var(--bg); padding: 6px 18px; color: var(--muted); }
#tab-bar button.active { background: var(--card); color: var(--gold);
  border-color: var(--border-hi); }

#content { padding: 14px; padding-right: 410px; min-height: 60vh; }
body.no-detail #content { padding-right: 14px; }

/* ── Cards ── */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 6px;
  padding: 8px; width: 210px; cursor: pointer; position: relative; }
.card:hover { border-color: var(--border-hi); background: var(--card-hi); }
.card.dimmed { opacity: 0.25; }
.card.selected { border-color: var(--gold); }
.card.flash { animation: flash 1.6s; }
@keyframes flash { 0%,60% { box-shadow: 0 0 0 3px var(--gold); } 100% { box-shadow: none; } }
.card .toprow { display: flex; gap: 8px; align-items: center; }
.card .no { font-family: var(--mono); font-size: 10px; color: var(--faint); }
.card .name { font-weight: 600; font-size: 13px; }
.card .cost { margin-left: auto; font-family: var(--mono); font-size: 12px;
  color: var(--gold); white-space: nowrap; display: flex; align-items: center; gap: 3px; }
.card .fx { font-size: 11px; color: var(--muted); margin-top: 4px; min-height: 15px; }
.card .badges { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 9px; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--border);
  color: var(--muted); white-space: nowrap; }
.badge.lock { color: var(--warn); border-color: #4A3E1E; }
.badge.req  { color: var(--blue); border-color: #1E304A; }
.badge.corrupt { color: var(--violet); border-color: #3A1E4A; }
.badge.act2 { color: var(--fg); background: #3A2E1E; }
.badge.sys  { color: var(--err); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.edited { background: var(--edited); }
.dot.note   { background: var(--note); }
.tagstrip { display: flex; gap: 3px; margin-top: 5px; }
.tagstrip span { height: 4px; flex: 1; border-radius: 2px; max-width: 34px; }
.tagchip { display: inline-flex; align-items: center; gap: 4px; font-size: 10px;
  padding: 1px 7px; border-radius: 9px; border: 1px solid var(--border);
  cursor: pointer; user-select: none; }
.tagchip .x { color: var(--muted); cursor: pointer; }
.tagchip .x:hover { color: var(--err); }
.tagchip.on { color: #111; font-weight: 600; }

/* ── Catalog view ── */
.dept { margin-bottom: 26px; }
.dept > h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
  color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.dept > h2 small { color: var(--muted); letter-spacing: 0; text-transform: none;
  font-weight: 400; margin-left: 10px; }
.cardgrid { display: flex; flex-wrap: wrap; gap: 10px; }

/* ── Table view ── */
table.items { border-collapse: collapse; width: 100%; font-size: 12px; }
table.items th { text-align: left; padding: 5px 8px; background: var(--panel);
  border-bottom: 2px solid var(--border); cursor: pointer; white-space: nowrap;
  position: sticky; top: 0; user-select: none; }
table.items th.sorted { color: var(--gold); }
table.items td { padding: 4px 8px; border-bottom: 1px solid #2A241E; vertical-align: middle; }
table.items tr.item:hover { background: var(--card-hi); cursor: pointer; }
table.items tr.grouphdr td { background: #26211C; color: var(--gold); font-weight: 600;
  border-top: 2px solid var(--border); }
#bulkbar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  background: var(--panel); border: 1px solid var(--gold-dim); border-radius: 8px;
  padding: 8px 14px; display: flex; gap: 10px; align-items: center; z-index: 60;
  box-shadow: 0 4px 20px #000A; }

/* ── Chains view ── */
.chainband { position: relative; margin-bottom: 18px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
.chainband svg.wires { position: absolute; inset: 0; pointer-events: none; }
.chainband .cards { position: relative; }
.chainband .card { position: absolute; }
#chains-layout { display: flex; gap: 14px; }
#chains-side { width: 170px; flex-shrink: 0; font-size: 11px; }
#chains-side .jump { padding: 3px 6px; border-radius: 4px; cursor: pointer; color: var(--muted); }
#chains-side .jump:hover { background: var(--card-hi); color: var(--fg); }
#chains-main { flex: 1; min-width: 0; }
.unchained-hdr { cursor: pointer; color: var(--muted); margin: 16px 0 8px; user-select: none; }

/* ── Detail panel ── */
#detail-panel { position: fixed; top: 0; right: 0; width: 396px; height: 100vh;
  background: var(--panel); border-left: 1px solid var(--border); z-index: 50;
  overflow-y: auto; padding: 14px; }
#detail-panel .close { position: absolute; top: 8px; right: 10px; }
#detail-panel h2 { margin: 4px 0 2px; }
#detail-panel .idline { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.field { margin: 10px 0; }
.field label { display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
.field input[type=text], .field input[type=number] { width: 100%; }
.field .revert { font-size: 10px; padding: 0 5px; }
.fx-preview { background: #191512; border: 1px dashed var(--border); border-radius: 4px;
  padding: 6px 8px; margin-top: 4px; font-size: 12px; }
.effects-cols { display: flex; gap: 10px; }
.effects-cols > div { flex: 1; min-width: 0; }
.effects-cols h4 { margin: 6px 0 4px; font-size: 11px; color: var(--muted);
  text-transform: uppercase; }
.effrow { font-family: var(--mono); font-size: 11px; padding: 2px 4px; border-radius: 3px;
  cursor: help; }
.effrow:hover { background: var(--card-hi); }
.gates { font-size: 12px; }
.gates a { color: var(--blue); cursor: pointer; text-decoration: none; }
.gates a:hover { text-decoration: underline; }
.sticker { display: inline-block; background: #3A331E; border: 1px solid #4A3E1E;
  color: var(--warn); font-size: 11px; padding: 2px 8px; border-radius: 3px; }

/* ── Tooltip ── */
#tooltip { position: fixed; z-index: 100; max-width: 340px; background: #191512;
  border: 1px solid var(--border-hi); border-radius: 5px; padding: 8px 10px;
  font-size: 11px; pointer-events: none; box-shadow: 0 4px 16px #000C;
  white-space: pre-wrap; }
#tooltip .tt-title { color: var(--gold); font-weight: 600; }

/* ── Modals ── */
.modal-veil { position: fixed; inset: 0; background: #000A; z-index: 80;
  display: flex; align-items: center; justify-content: center; }
.modal { background: var(--panel); border: 1px solid var(--border-hi); border-radius: 8px;
  padding: 16px; max-height: 86vh; overflow-y: auto; box-shadow: 0 8px 40px #000; }
.modal h3 { margin-top: 0; color: var(--gold); }
#sprite-modal .modal { width: 860px; }
#sprite-grid { display: flex; flex-wrap: wrap; gap: 6px; max-height: 48vh;
  overflow-y: auto; background: #191512; padding: 8px; border-radius: 6px; }
.spritecell { width: 84px; text-align: center; padding: 4px; border: 1px solid transparent;
  border-radius: 4px; cursor: pointer; font-size: 9px; color: var(--muted);
  overflow-wrap: break-word; }
.spritecell:hover { border-color: var(--border-hi); background: var(--card-hi); }
.spritecell.current { border-color: var(--gold); }
.spritecell .box { height: 64px; display: flex; align-items: center; justify-content: center; }
.spritecell .alias { color: var(--gold); font-size: 8px; }
#sprite-preview { display: flex; gap: 16px; align-items: flex-end; margin-top: 10px;
  min-height: 90px; }
#tag-modal .modal { width: 480px; }
#tag-modal table { width: 100%; border-collapse: collapse; }
#tag-modal td { padding: 4px 6px; border-bottom: 1px solid #2A241E; }
.swatch { width: 16px; height: 16px; border-radius: 3px; display: inline-block;
  cursor: pointer; border: 1px solid #0006; }

/* ── Stats view ── */
.statblock { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 16px; margin-bottom: 16px; }
.statblock h3 { margin-top: 0; color: var(--gold); font-size: 13px;
  text-transform: uppercase; letter-spacing: 1px; }
table.stat { border-collapse: collapse; font-size: 12px; }
table.stat th { text-align: left; padding: 3px 12px 3px 0; color: var(--muted);
  border-bottom: 1px solid var(--border); }
table.stat td { padding: 3px 12px 3px 0; border-bottom: 1px solid #2A241E; }
table.stat td.num, table.stat th.num { text-align: right; font-family: var(--mono); }
.gaterow { margin: 4px 0; font-size: 12px; }
.gaterow .kind { display: inline-block; width: 190px; color: var(--muted);
  font-family: var(--mono); font-size: 11px; }
.gaterow .stop { cursor: pointer; }
.gaterow .stop:hover { color: var(--gold); }

/* ── Sim view ── */
#sim-layout { display: flex; gap: 14px; align-items: flex-start; }
#sim-loadout { width: 320px; flex-shrink: 0; }
#sim-main { flex: 1; min-width: 0; }
#sim-scenario { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 12px; font-size: 12px; }
#sim-scenario label { color: var(--muted); display: flex; gap: 4px; align-items: center; }
#sim-scenario input[type=number] { width: 90px; }
.upg-dial { display: flex; gap: 6px; align-items: center; }
.upg-dial input[type=range] { width: 110px; }
.upg-dial .lvl { font-family: var(--mono); width: 22px; text-align: right; }
#sim-items { max-height: 62vh; overflow-y: auto; background: var(--panel);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
.sim-item { display: flex; gap: 6px; align-items: center; padding: 2px 4px;
  border-radius: 3px; font-size: 12px; }
.sim-item:hover { background: var(--card-hi); }
.sim-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.sim-item .cost { font-family: var(--mono); font-size: 10px; color: var(--gold); }
.cov { font-size: 8px; padding: 0 4px; border-radius: 3px; border: 1px solid var(--border); }
.cov.full { color: var(--good); border-color: #2E4A2E; }
.cov.part { color: var(--warn); border-color: #4A3E1E; }
.cov.none { color: var(--faint); }
.corrupt-cb { accent-color: var(--violet); }
table.simres { border-collapse: collapse; font-size: 12px; width: 100%; }
table.simres th { text-align: right; padding: 3px 10px; color: var(--muted);
  border-bottom: 1px solid var(--border); }
table.simres th:first-child, table.simres td:first-child { text-align: left; }
table.simres td { padding: 3px 10px; border-bottom: 1px solid #2A241E;
  text-align: right; font-family: var(--mono); }
td.delta-pos { color: var(--good); } td.delta-neg { color: var(--err); }
.distbar { display: inline-flex; height: 9px; width: 110px; border-radius: 2px;
  overflow: hidden; vertical-align: middle; }
.distbar span { height: 100%; }
#sim-marg td { cursor: pointer; }
</style>
</head>
<body class="no-detail">

<div id="header">
  <h1>Catalog Designer</h1>
  <span id="hdr-sub" class="muted"></span>
  <span class="spacer"></span>
  <span id="save-pill" title="tools/catalog_meta.json save state">no folder</span>
  <button id="btn-tags">Tags…</button>
  <button id="btn-import">Import…</button>
  <button id="btn-export" class="primary">Export edits</button>
  <button id="btn-meta-dl" class="hidden">Download meta</button>
</div>

<div id="status-strip"></div>

<div id="picker-zone">
  <h2>Open the poker-idle project</h2>
  <div id="reopen-row" class="hidden"><button id="btn-reopen" class="primary"></button></div>
  <button id="btn-pick" class="primary">Open project folder (read + write meta)</button>
  <div class="or">— or drag the project folder here (read-only mode) —</div>
  <input type="file" id="dir-input" webkitdirectory class="hidden">
  <button id="btn-pick-ro">Pick folder (read-only)</button>
  <div id="picker-err"></div>
  <p class="faint" style="margin-top:22px">Reads data/catalog.lua, catalog_pages.lua, effects.lua,
  balance.lua, assets/sprites/aliases.json.<br>Writes only tools/catalog_meta.json (tags + notes).
  Game files are never written.</p>
</div>

<div id="global-bar">
  <input type="search" id="f-search" placeholder="search name / id / text…">
  <select id="f-phase"><option value="">phase: all</option></select>
  <select id="f-act"><option value="">act: all</option><option value="1">act 1</option><option value="2">act 2</option></select>
  <select id="f-dept"><option value="">dept: all</option></select>
  <span class="tagchips" id="f-tags"></span>
  <label style="font-size:11px;color:var(--muted)"><input type="checkbox" id="f-edited"> edited only</label>
  <span class="spacer"></span>
  <span id="f-count" class="faint"></span>
</div>

<div id="tab-bar">
  <button data-tab="chains">Chains</button>
  <button data-tab="catalog">Catalog</button>
  <button data-tab="table">Table</button>
  <button data-tab="stats">Stats</button>
  <button data-tab="sim">Sim</button>
</div>

<div id="content"></div>
<div id="detail-panel" class="hidden"></div>
<div id="tooltip" class="hidden"></div>
<div id="bulkbar" class="hidden"></div>
<div id="sprite-modal" class="modal-veil hidden"><div class="modal"></div></div>
<div id="tag-modal" class="modal-veil hidden"><div class="modal"></div></div>
<div id="import-modal" class="modal-veil hidden"><div class="modal"></div></div>
<input type="file" id="import-input" accept=".json" class="hidden">

<script src="vendor/fengari-web.js"></script>
<script>
"use strict";
/* ══════════════ S1 · CONST ══════════════ */
// Colors transcribed from data/theme.lua (grind palette). Source of truth
// is that file; update here if it changes.
const COLORS = {
  chip:      "#EDBF4D", chipRing:  "#856624",   // Theme.currency lines 224-227
  achip:     "#A659F2", achipRing: "#59268C",
  tierWin:  { small: "#619157", medium: "#75B86B", large: "#8FDB7A", jackpot: "#F5C74D" },
  tierLoss: { small: "#85544F", medium: "#B3665E", large: "#DB7066", jackpot: "#F25285" },
};
const TIER_COUNT = { small: 1, medium: 2, large: 3, jackpot: 4, stack: 4 }; // views/TierGlyph.lua
const TAG_PALETTE = ["#F25285","#F2B333","#73D973","#73A6D9","#BF73F2","#EDBF4D",
                     "#5ED9C3","#F2825E","#9CB35E","#D973B8"];
const LS_EDITS = "catalog_designer_edits_v1";
const LS_METABUF = "catalog_designer_meta_buffer";
const LS_UI = "catalog_designer_ui_v1";
const META_PATH = ["tools", "catalog_meta.json"];
// Fallback balance values; overwritten by data/balance.lua regexes at load.
let RUN_MINUTES = 20, K_SHOVE = 0.01;
// data/bankroll_tiers.lua (verified 2026-09-01)
const BANKROLL_TIERS = [
  { threshold: 0, mult: 1, label: "Sub-T1" }, { threshold: 2, mult: 1, label: "T1" },
  { threshold: 10, mult: 2, label: "T2" }, { threshold: 100, mult: 3, label: "T3" },
  { threshold: 1000, mult: 4, label: "T4" }, { threshold: 10000, mult: 5, label: "T5" },
  { threshold: 100000, mult: 6, label: "T6" }, { threshold: 1000000, mult: 7, label: "T7" },
  { threshold: 10000000, mult: 8, label: "T8" },
];
// Unlock kinds → human labels (models/catalog_unlock_rules.lua). Flag kinds
// have no counter and render as a bare imperative.
const UNLOCK_FLAGS = new Set(["shove_r1_won", "has_shoved", "hu_unlocked", "decks_maxed"]);

/* ══════════════ utils ══════════════ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
function esc(s) { return String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function el(tag, attrs, html) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else e.setAttribute(k, v);
  }
  if (html != null) e.innerHTML = html;
  return e;
}
function debounce(fn, ms) {
  let t = null;
  const d = (...a) => { clearTimeout(t); t = setTimeout(() => { t = null; fn(...a); }, ms); };
  d.flush = (...a) => { if (t) { clearTimeout(t); t = null; fn(...a); } };
  d.pending = () => t != null;
  return d;
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = v => Math.round(v * f).toString(16).padStart(2, "0");
  return "#" + c((n >> 16) & 255) + c((n >> 8) & 255) + c(n & 255);
}
function fmtMoney(n) { return "$" + Number(n).toLocaleString("en-US"); }
function nowIso() { return new Date().toISOString(); }
function lsGet(key, dflt) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : dflt; }
  catch (e) { return dflt; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}
function download(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ── tiny IndexedDB for the directory handle ── */
function idb() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open("catalog_designer", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbGet(key) {
  const db = await idb();
  return new Promise((res, rej) => {
    const rq = db.transaction("kv").objectStore("kv").get(key);
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
  });
}
async function idbSet(key, val) {
  const db = await idb();
  return new Promise((res, rej) => {
    const rq = db.transaction("kv", "readwrite").objectStore("kv").put(val, key);
    rq.onsuccess = () => res(); rq.onerror = () => rej(rq.error);
  });
}

/* ══════════════ S2 · Lua-literal parser ══════════════ */
// Extract the balanced {...} following an anchor regex, skipping strings,
// line comments (--), block comments (--[[ ]]), and long strings ([[ ]]).
function extractLiteral(text, anchors) {
  for (const re of anchors) {
    const m = text.match(re);
    if (!m) continue;
    let i = text.indexOf("{", m.index + m[0].length - 1);
    if (i < 0) continue;
    const start = i;
    let depth = 0;
    while (i < text.length) {
      const c = text[i];
      if (c === "-" && text[i + 1] === "-") {
        if (text[i + 2] === "[" && text[i + 3] === "[") {          // block comment
          const end = text.indexOf("]]", i + 4);
          i = end < 0 ? text.length : end + 2; continue;
        }
        const nl = text.indexOf("\n", i);                           // line comment
        i = nl < 0 ? text.length : nl + 1; continue;
      }
      if (c === '"' || c === "'") {
        i++;
        while (i < text.length && text[i] !== c) { if (text[i] === "\\") i++; i++; }
        i++; continue;
      }
      if (c === "[" && text[i + 1] === "[") {                       // long string
        const end = text.indexOf("]]", i + 2);
        i = end < 0 ? text.length : end + 2; continue;
      }
      if (c === "{") depth++;
      if (c === "}") { depth--; if (depth === 0) return text.slice(start, i + 1); }
      i++;
    }
    throw new Error("unbalanced braces after anchor " + re);
  }
  throw new Error("no anchor matched: " + anchors.map(String).join(" | "));
}

function tokenizeLua(src) {
  const toks = []; // {t: "punct"|"ident"|"num"|"str"|"bool"|"nil", v, line}
  let i = 0, line = 1;
  const n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === "\n") { line++; i++; continue; }
    if (c === " " || c === "\t" || c === "\r") { i++; continue; }
    if (c === "-" && src[i + 1] === "-") {
      if (src[i + 2] === "[" && src[i + 3] === "[") {
        const end = src.indexOf("]]", i + 4);
        const seg = src.slice(i, end < 0 ? n : end + 2);
        line += (seg.match(/\n/g) || []).length;
        i = end < 0 ? n : end + 2; continue;
      }
      const nl = src.indexOf("\n", i);
      i = nl < 0 ? n : nl; continue;
    }
    if (c === '"' || c === "'") {
      let j = i + 1, out = "";
      while (j < n && src[j] !== c) {
        if (src[j] === "\\") {
          const e = src[j + 1];
          out += e === "n" ? "\n" : e === "t" ? "\t" : e; j += 2;
        } else { out += src[j]; j++; }
      }
      toks.push({ t: "str", v: out, line }); i = j + 1; continue;
    }
    if (c === "[" && src[i + 1] === "[") {
      const end = src.indexOf("]]", i + 2);
      const body = src.slice(i + 2, end < 0 ? n : end);
      line += (body.match(/\n/g) || []).length;
      toks.push({ t: "str", v: body, line }); i = end < 0 ? n : end + 2; continue;
    }
    if ("{}[]=,;".includes(c)) { toks.push({ t: "punct", v: c, line }); i++; continue; }
    if (/[0-9]/.test(c) || (c === "-" && /[0-9.]/.test(src[i + 1] || "")) ||
        (c === "." && /[0-9]/.test(src[i + 1] || ""))) {
      let j = i + 1;
      while (j < n && /[0-9.eExX+\-a-fA-F]/.test(src[j])) {
        if ((src[j] === "+" || src[j] === "-") && !/[eE]/.test(src[j - 1])) break;
        j++;
      }
      toks.push({ t: "num", v: Number(src.slice(i, j)), line }); i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i + 1;
      while (j < n && /[A-Za-z0-9_]/.test(src[j])) j++;
      const w = src.slice(i, j);
      if (w === "true" || w === "false") toks.push({ t: "bool", v: w === "true", line });
      else if (w === "nil") toks.push({ t: "nil", v: null, line });
      else toks.push({ t: "ident", v: w, line });
      i = j; continue;
    }
    throw new Error(`unexpected char '${c}' at line ${line}`);
  }
  return toks;
}

// Recursive-descent parse over the token stream. Pure-array tables become
// JS arrays, otherwise objects (catalog data never mixes).
function parseLua(src) {
  const toks = tokenizeLua(src);
  let p = 0;
  const peek = () => toks[p];
  const next = () => toks[p++];
  const err = (msg) => { const t = toks[p]; throw new Error(msg + (t ? ` at line ${t.line}` : " at EOF")); };
  function parseValue() {
    const t = peek();
    if (!t) err("unexpected EOF");
    if (t.t === "punct" && t.v === "{") return parseTable();
    if (t.t === "str" || t.t === "num" || t.t === "bool" || t.t === "nil") { next(); return t.v; }
    err(`unexpected token '${t.v}'`);
  }
  function parseTable() {
    const open = next();
    if (!(open.t === "punct" && open.v === "{")) err("expected {");
    const arr = []; const obj = {}; let hasHash = false;
    for (;;) {
      let t = peek();
      if (!t) err("unclosed table");
      if (t.t === "punct" && t.v === "}") { next(); break; }
      if (t.t === "punct" && (t.v === "," || t.v === ";")) { next(); continue; }
      if (t.t === "ident" && toks[p + 1] && toks[p + 1].t === "punct" && toks[p + 1].v === "=") {
        const key = next().v; next(); // '='
        obj[key] = parseValue(); hasHash = true;
      } else if (t.t === "punct" && t.v === "[") {
        next();
        const key = parseValue();
        const close = next();
        if (!(close.t === "punct" && close.v === "]")) err("expected ]");
        const eq = next();
        if (!(eq.t === "punct" && eq.v === "=")) err("expected =");
        obj[key] = parseValue(); hasHash = true;
      } else {
        arr.push(parseValue());
      }
    }
    if (hasHash) {
      if (arr.length) arr.forEach((v, i) => { obj[i + 1] = v; });
      return obj;
    }
    return arr;
  }
  // Top level with per-element recovery: used for the catalog item list so
  // one malformed item skips with a warning instead of killing the load.
  function parseTopArrayRecovering() {
    const open = next();
    if (!(open.t === "punct" && open.v === "{")) err("expected {");
    const out = []; const warns = [];
    let index = 0;
    for (;;) {
      let t = peek();
      if (!t) { warns.push({ index, message: "unclosed top-level table" }); break; }
      if (t.t === "punct" && t.v === "}") { next(); break; }
      if (t.t === "punct" && (t.v === "," || t.v === ";")) { next(); continue; }
      index++;
      const mark = p;
      try {
        out.push(parseValue());
      } catch (e) {
        warns.push({ index, message: e.message, line: toks[mark] && toks[mark].line });
        // skip to the next ',' or '}' at element depth
        p = mark; let depth = 0;
        while (p < toks.length) {
          const tk = toks[p];
          if (tk.t === "punct") {
            if (tk.v === "{") depth++;
            else if (tk.v === "}") { if (depth === 0) break; depth--; }
            else if (tk.v === "," && depth === 0) break;
          }
          p++;
        }
      }
    }
    return { items: out, warns };
  }
  return { parseValue, parseTable, parseTopArrayRecovering, get pos() { return p; } };
}

function parseLuaLiteral(src) { return parseLua(src).parseValue(); }
function parseCatalogItems(src) { return parseLua(src).parseTopArrayRecovering(); }

/* ══════════════ S3 · Ingress ══════════════ */
const FS_OK = "showDirectoryPicker" in window;
if (!FS_OK) $("#btn-pick").classList.add("hidden");

async function readText(relpath) {
  const h = S.files.get(relpath);
  if (!h) return null;
  const file = h.getFile ? await h.getFile() : h;
  return file.text();
}
async function spriteUrl(relpath) {
  if (S.spriteUrls.has(relpath)) return S.spriteUrls.get(relpath);
  const h = S.files.get(relpath);
  if (!h) return null;
  const file = h.getFile ? await h.getFile() : h;
  const url = URL.createObjectURL(file);
  S.spriteUrls.set(relpath, url);
  return url;
}

const SKIP_DIRS = new Set([".git", "node_modules", ".claude", "build-tools"]);
async function walkFsDir(dirHandle, prefix, map, depth) {
  if (depth > 8) return;
  for await (const [name, h] of dirHandle.entries()) {
    if (h.kind === "directory") {
      if (SKIP_DIRS.has(name) || name.startsWith(".")) continue;
      await walkFsDir(h, prefix + name + "/", map, depth + 1);
    } else {
      map.set(prefix + name, h);
    }
  }
}
function walkEntry(entry, prefix, map) {
  return new Promise((resolve) => {
    if (entry.isFile) {
      entry.file(f => { map.set(prefix + entry.name, f); resolve(); }, resolve);
    } else if (entry.isDirectory) {
      if (SKIP_DIRS.has(entry.name) || entry.name.startsWith(".")) return resolve();
      const rd = entry.createReader();
      const all = [];
      const readBatch = () => rd.readEntries(async (ents) => {
        if (!ents.length) {
          for (const e of all) await walkEntry(e, prefix + entry.name + "/", map);
          resolve();
        } else { all.push(...ents); readBatch(); }
      }, resolve);
      readBatch();
    } else resolve();
  });
}

// If the picked folder is a parent, find the child dir holding data/catalog.lua
// and re-root the map (strip its prefix).
function rerootFiles(map) {
  if (map.has("data/catalog.lua")) return map;
  let root = null;
  for (const key of map.keys()) {
    const m = key.match(/^([^/]+)\/data\/catalog\.lua$/);
    if (m) { root = m[1] + "/"; break; }
  }
  if (!root) return map;
  const out = new Map();
  for (const [k, v] of map) if (k.startsWith(root)) out.set(k.slice(root.length), v);
  return out;
}

async function openViaPicker() {
  try {
    const handle = await window.showDirectoryPicker({ id: "poker-idle", mode: "readwrite" });
    await openFromHandle(handle);
  } catch (e) {
    if (e.name !== "AbortError") showPickerError(e);
  }
}
async function openFromHandle(handle) {
  const map = new Map();
  await walkFsDir(handle, "", map, 0);
  const rooted = rerootFiles(map);
  if (!rooted.has("data/catalog.lua")) {
    return showPickerError(new Error("data/catalog.lua not found in the picked folder (or one level below it)"));
  }
  S.mode = "fs"; S.dirHandle = handle; S.files = rooted;
  try { await idbSet("projectDir", handle); } catch (e) {}
  await loadAll();
}
async function openReadOnly(map) {
  const rooted = rerootFiles(map);
  if (!rooted.has("data/catalog.lua")) {
    return showPickerError(new Error("data/catalog.lua not found in the dropped folder"));
  }
  S.mode = "ro"; S.dirHandle = null; S.files = rooted;
  await loadAll();
}
function showPickerError(e) {
  $("#picker-err").textContent = String(e.message || e);
}

/* ── loadAll: parse everything, build model, boot UI ── */
async function loadAll() {
  S.warnings = [];
  const [catSrc, pagesSrc, effectsSrc, balanceSrc, aliasesSrc, metaSrc] = await Promise.all([
    readText("data/catalog.lua"), readText("data/catalog_pages.lua"),
    readText("data/effects.lua"), readText("data/balance.lua"),
    readText("assets/sprites/aliases.json"), readText(META_PATH.join("/")),
  ]);
  if (!catSrc) return showPickerError(new Error("could not read data/catalog.lua"));

  // balance regexes (fallbacks stand if absent)
  if (balanceSrc) {
    const rm = balanceSrc.match(/Balance\.RUN_MINUTES\s*=\s*([\d.]+)/);
    const ks = balanceSrc.match(/Balance\.K_SHOVE_PER_ITEM\s*=\s*([\d.]+)/);
    if (rm) RUN_MINUTES = Number(rm[1]);
    if (ks) K_SHOVE = Number(ks[1]);
  }

  let items = [], parseWarns = [];
  try {
    const lit = extractLiteral(catSrc, [/local\s+items\s*=\s*\{/, /return\s*\{/]);
    const res = parseCatalogItems(lit);
    items = res.items; parseWarns = res.warns;
  } catch (e) {
    return showPickerError(new Error("catalog.lua parse failed: " + e.message));
  }
  for (const w of parseWarns)
    S.warnings.push(`item #${w.index} skipped: ${w.message}`);

  let pages = [];
  try { pages = parseLuaLiteral(extractLiteral(pagesSrc || "", [/return\s*\{/])); }
  catch (e) { S.warnings.push("catalog_pages.lua: " + e.message); }

  let effectKinds = {};
  try { effectKinds = parseLuaLiteral(extractLiteral(effectsSrc || "", [/Effects\.kinds\s*=\s*\{/])); }
  catch (e) { S.warnings.push("effects.lua: " + e.message); }

  // procs/routers: nice-to-have tooltips; failure is silent-but-noted
  let procs = {}, routers = {};
  for (const [rel, target] of [["data/procs.lua", "procs"], ["data/routers.lua", "routers"]]) {
    try {
      const src = await readText(rel);
      if (src) {
        const lit = extractLiteral(src, [/local\s+\w+\s*=\s*\{/, /return\s*\{/]);
        const parsed = parseLuaLiteral(lit);
        if (target === "procs") procs = parsed; else routers = parsed;
      }
    } catch (e) { S.warnings.push(rel + " (tooltips only): " + e.message); }
  }

  let aliases = {};
  try {
    const j = JSON.parse(aliasesSrc || "{}");
    aliases = j.aliases || j;
  } catch (e) { S.warnings.push("aliases.json: " + e.message); }

  buildModel(items, pages, effectKinds, aliases, procs, routers);
  S.edits = (lsGet(LS_EDITS, { edits: {} }).edits) || {};
  loadMeta(metaSrc);
  const ui = lsGet(LS_UI, null);
  if (ui) {
    const simDflt = S.ui.sim;
    S.ui = Object.assign(S.ui, ui);
    S.ui.filters = Object.assign(
      { search: "", phase: "", act: "", dept: "", tags: [], editedOnly: false }, ui.filters);
    S.ui.sim = Object.assign(simDflt, ui.sim || {});
  }
  bootUi();
  bootEngine();   // async; Sim tab shows progress until ready
}
/* ══════════════ S4 · Model ══════════════ */
// Mirrors models/catalog_loader.lua: authored cost is the file's cost_chip;
// derived = max(1, floor(authored × RUN_MINUTES/20 + 0.5)); ownable =
// phase ~= "system" and not gate; shove is flat K_SHOVE per ownable item.
function deriveCost(authored) {
  if (!authored || authored <= 0) return 0;
  return Math.max(1, Math.floor(authored * (RUN_MINUTES / 20) + 0.5));
}
function isOwnable(it) { return it.phase !== "system" && !it.gate; }

// models/shove_rate.lua: bracket + log-interp multiplier.
function bankrollMult(bankroll) {
  bankroll = Math.max(0, bankroll || 0);
  let lower = BANKROLL_TIERS[0], upper = null;
  for (let i = 0; i < BANKROLL_TIERS.length; i++) {
    if (bankroll >= BANKROLL_TIERS[i].threshold) {
      lower = BANKROLL_TIERS[i]; upper = BANKROLL_TIERS[i + 1] || null;
    } else break;
  }
  if (!upper || lower.mult === upper.mult) return lower.mult;
  const lo = Math.max(0.01, lower.threshold);
  const b = Math.max(lo, bankroll);
  let frac = (Math.log(b) - Math.log(lo)) / (Math.log(upper.threshold) - Math.log(lo));
  frac = Math.min(1, Math.max(0, frac));
  return lower.mult + (upper.mult - lower.mult) * frac;
}
function shoveR1(ownedCount, bankroll) {
  return Math.min(0.99, Math.min(1, K_SHOVE * ownedCount * bankrollMult(bankroll)));
}

function buildModel(rawItems, pages, effectKinds, aliases, procs, routers) {
  const items = [];
  rawItems.forEach((raw, i) => {
    if (!raw || typeof raw !== "object" || !raw.id) {
      S.warnings.push(`entry #${i + 1} has no id — skipped`); return;
    }
    items.push({
      raw, id: raw.id, no: items.length + 1,
      ownable: isOwnable(raw),
    });
  });
  const byId = new Map(items.map(it => [it.id, it]));

  // requires forest
  const childrenOf = new Map();
  let edgeCount = 0;
  for (const it of items) {
    const req = it.raw.requires;
    if (req) {
      if (!byId.has(req)) S.warnings.push(`${it.id}: requires unknown item '${req}'`);
      else {
        if (!childrenOf.has(req)) childrenOf.set(req, []);
        childrenOf.get(req).push(it.id);
        edgeCount++;
      }
    }
  }
  function rootOf(id) {
    let cur = byId.get(id), guard = 0;
    while (cur && cur.raw.requires && byId.has(cur.raw.requires) && guard++ < 20)
      cur = byId.get(cur.raw.requires);
    return cur ? cur.id : id;
  }
  function depthOf(id) {
    let cur = byId.get(id), d = 0, guard = 0;
    while (cur && cur.raw.requires && byId.has(cur.raw.requires) && guard++ < 20) {
      d++; cur = byId.get(cur.raw.requires);
    }
    return d;
  }
  for (const it of items) { it.root = rootOf(it.id); it.depth = depthOf(it.id); }

  // components (chains): roots that have children, plus everything under them
  const compMap = new Map(); // root id -> [item ids]
  for (const it of items) {
    if (!compMap.has(it.root)) compMap.set(it.root, []);
    compMap.get(it.root).push(it.id);
  }
  const chains = [], unchained = [];
  for (const [root, members] of compMap) {
    if (members.length > 1) chains.push({ root, members });
    else unchained.push(root);
  }
  chains.sort((a, b) => byId.get(a.root).no - byId.get(b.root).no);

  // departments
  const deptOf = new Map(); const deptOrder = [];
  for (const page of (pages || [])) {
    if (!page || !page.title) continue;
    deptOrder.push(page.title);
    for (const id of (page.items || [])) {
      if (byId.has(id)) deptOf.set(id, page.title);
      else S.warnings.push(`catalog_pages: unknown item '${id}' in '${page.title}'`);
    }
  }
  const etc = [], system = [];
  for (const it of items) {
    if (!deptOf.has(it.id)) {
      if (it.raw.hidden || it.raw.phase === "system") { deptOf.set(it.id, "System"); system.push(it.id); }
      else { deptOf.set(it.id, "&c."); etc.push(it.id); }
    }
  }
  if (etc.length) deptOrder.push("&c.");
  if (system.length) deptOrder.push("System");

  S.model = {
    items, byId, childrenOf, chains, unchained, deptOf, deptOrder,
    effectKinds, aliases, procs, routers, edgeCount,
    pages: pages || [],
    ownableCount: items.filter(it => it.ownable).length,
    spritePoolPrefix: "assets/sprites/",
  };
  // sprite pool: every png under assets/sprites/ except cards/
  S.model.spritePool = [];
  for (const key of S.files.keys()) {
    if (key.startsWith("assets/sprites/") && key.endsWith(".png") &&
        !key.startsWith("assets/sprites/cards/") &&
        !key.startsWith("assets/sprites/isometric/"))
      S.model.spritePool.push(key.slice("assets/sprites/".length, -4));
  }
  S.model.spritePool.sort();
  S.model.aliasTargets = new Map(); // target relpath-no-ext -> alias name
  for (const [name, target] of Object.entries(aliases)) S.model.aliasTargets.set(target, name);
}

// The effective (edit-overlaid) view of an item. All views read this.
function effective(it) {
  const e = S.edits[it.id] || {};
  const raw = it.raw;
  return {
    name: e.name ?? raw.name,
    description: e.description ?? raw.description,
    effect_text: e.effect_text ?? raw.effect_text,
    cost_chip: e.cost_chip ?? raw.cost_chip,
    sprite_target: e.sprite_target ?? (raw.sprite ? S.model.aliases[raw.sprite] : null),
    corrupt_effect_text: e.corrupt_effect_text ?? (raw.corrupt && raw.corrupt.effect_text),
    corrupt_cost_achip: e.corrupt_cost_achip ?? (raw.corrupt && raw.corrupt.cost_achip),
  };
}
function authoredValue(it, field) {
  const raw = it.raw;
  switch (field) {
    case "name": return raw.name;
    case "description": return raw.description;
    case "effect_text": return raw.effect_text;
    case "cost_chip": return raw.cost_chip;
    case "sprite_target": return raw.sprite ? S.model.aliases[raw.sprite] : null;
    case "corrupt_effect_text": return raw.corrupt && raw.corrupt.effect_text;
    case "corrupt_cost_achip": return raw.corrupt && raw.corrupt.cost_achip;
  }
}
function isEdited(id) { return !!S.edits[id] && Object.keys(S.edits[id]).length > 0; }

/* ══════════════ S5 · Edits overlay ══════════════ */
function setEdit(id, field, value) {
  const it = S.model.byId.get(id);
  if (!it) return;
  const authored = authoredValue(it, field);
  if (!S.edits[id]) S.edits[id] = {};
  const same = (value === authored) ||
    (value == null && authored == null) ||
    (typeof authored === "number" && Number(value) === authored);
  if (same) delete S.edits[id][field];
  else S.edits[id][field] = (field === "cost_chip" || field === "corrupt_cost_achip")
    ? Number(value) : value;
  if (!Object.keys(S.edits[id]).length) delete S.edits[id];
  lsSet(LS_EDITS, { version: 1, edits: S.edits });
}

/* ══════════════ S6 · Meta store (tags + notes → tools/catalog_meta.json) ══════════════ */
function emptyMeta() { return { tool: "catalog_designer", version: 1, updated_at: nowIso(),
  tags: [], assignments: {}, notes: {} }; }

function loadMeta(sidecarSrc) {
  let sidecar = null;
  if (sidecarSrc) {
    try { sidecar = JSON.parse(sidecarSrc); }
    catch (e) { S.warnings.push("catalog_meta.json unreadable: " + e.message); }
  }
  const buffer = lsGet(LS_METABUF, null);
  S.meta = sidecar || emptyMeta();
  S.meta.tags = S.meta.tags || []; S.meta.assignments = S.meta.assignments || {};
  S.meta.notes = S.meta.notes || {}; S.meta.loadouts = S.meta.loadouts || {};
  // crash recovery: buffer newer than the sidecar
  if (buffer && (!sidecar || (buffer.updated_at || "") > (sidecar.updated_at || ""))) {
    if (confirm("Unsaved tag/note changes from a previous session were found. Recover them?")) {
      S.meta = buffer;
    } else {
      localStorage.removeItem(LS_METABUF);
    }
  }
  // meta entries pointing at unknown ids: keep, but warn
  const unknown = new Set();
  for (const id of Object.keys(S.meta.assignments)) if (!S.model.byId.has(id)) unknown.add(id);
  for (const id of Object.keys(S.meta.notes)) if (!S.model.byId.has(id)) unknown.add(id);
  if (unknown.size)
    S.warnings.push(`meta references ${unknown.size} unknown item id(s): ${[...unknown].join(", ")} (kept)`);
}

function tagDef(name) { return S.meta.tags.find(t => t.name === name); }
function tagColor(name) {
  const d = tagDef(name);
  if (d && d.color) return d.color;
  const i = S.meta.tags.findIndex(t => t.name === name);
  return TAG_PALETTE[(i >= 0 ? i : 0) % TAG_PALETTE.length];
}
function itemTags(id) { return S.meta.assignments[id] || []; }
function tagUsage(name) {
  let n = 0;
  for (const list of Object.values(S.meta.assignments)) if (list.includes(name)) n++;
  return n;
}
function createTag(name, color) {
  name = name.trim();
  if (!name || tagDef(name)) return false;
  S.meta.tags.push({ name, color: color || TAG_PALETTE[S.meta.tags.length % TAG_PALETTE.length],
                     created: nowIso() });
  metaChanged(); return true;
}
function renameTag(oldName, newName) {
  newName = newName.trim();
  if (!newName || tagDef(newName)) return false;
  const d = tagDef(oldName); if (!d) return false;
  d.name = newName;
  for (const list of Object.values(S.meta.assignments)) {
    const i = list.indexOf(oldName); if (i >= 0) list[i] = newName;
  }
  const f = S.ui.filters.tags.indexOf(oldName);
  if (f >= 0) S.ui.filters.tags[f] = newName;
  metaChanged(); return true;
}
function deleteTag(name) {
  S.meta.tags = S.meta.tags.filter(t => t.name !== name);
  for (const [id, list] of Object.entries(S.meta.assignments)) {
    S.meta.assignments[id] = list.filter(t => t !== name);
    if (!S.meta.assignments[id].length) delete S.meta.assignments[id];
  }
  S.ui.filters.tags = S.ui.filters.tags.filter(t => t !== name);
  metaChanged();
}
function assignTag(id, name, on) {
  const list = S.meta.assignments[id] || (S.meta.assignments[id] = []);
  const i = list.indexOf(name);
  if (on && i < 0) list.push(name);
  if (!on && i >= 0) list.splice(i, 1);
  if (!list.length) delete S.meta.assignments[id];
  metaChanged();
}
function setNote(id, text) {
  if (text && text.trim()) S.meta.notes[id] = text;
  else delete S.meta.notes[id];
  metaChanged();
}

/* ── save scheduler: sync crash buffer + debounced sidecar write ── */
const writeSidecar = debounce(doWriteSidecar, 1000);
function metaChanged() {
  S.meta.updated_at = nowIso();
  lsSet(LS_METABUF, S.meta);
  if (S.mode === "fs") { setSavePill("saving"); writeSidecar(); }
  else setSavePill("readonly");
}
async function doWriteSidecar() {
  if (S.mode !== "fs" || !S.dirHandle) return;
  try {
    let dir = S.dirHandle;
    for (const seg of META_PATH.slice(0, -1))
      dir = await dir.getDirectoryHandle(seg, { create: true });
    const fh = await dir.getFileHandle(META_PATH[META_PATH.length - 1], { create: true });
    const w = await fh.createWritable();
    await w.write(metaJson());
    await w.close();
    localStorage.removeItem(LS_METABUF);
    setSavePill("saved");
  } catch (e) {
    console.error("meta write failed", e);
    setSavePill("failed");
  }
}
function metaJson() {
  const m = S.meta;
  const sortObj = (o) => Object.fromEntries(Object.keys(o).sort().map(k => [k, o[k]]));
  return JSON.stringify({
    tool: "catalog_designer", version: 1, updated_at: m.updated_at,
    tags: m.tags, assignments: sortObj(m.assignments), notes: sortObj(m.notes),
    loadouts: sortObj(m.loadouts || {}),
  }, null, 2) + "\n";
}
function setSavePill(state) {
  const pill = $("#save-pill");
  pill.className = "";
  if (state === "saved") { pill.classList.add("saved");
    pill.textContent = "meta saved " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  else if (state === "saving") { pill.classList.add("saving"); pill.textContent = "saving…"; }
  else if (state === "failed") { pill.classList.add("failed"); pill.textContent = "write failed — click to retry"; }
  else if (state === "readonly") { pill.classList.add("readonly"); pill.textContent = "read-only — meta in browser only"; }
  else pill.textContent = state;
}
$("#save-pill").addEventListener("click", () => {
  if ($("#save-pill").classList.contains("failed")) { setSavePill("saving"); doWriteSidecar(); }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") writeSidecar.flush();
});
window.addEventListener("beforeunload", () => { writeSidecar.flush(); });
/* ══════════════ S7 · IconText glyphs (SVG) ══════════════ */
// Mirrors views/IconText.lua + views/TierGlyph.lua + views/Chips.drawGlyph.
// Chip: outer disc (ring @0.75 shade) → rim (ring) → face (@0.76r body) →
// inner ring stroke @0.42r. Detail spots omitted (below MIN_DETAIL_R at UI sizes).
function chipSvg(size, body, ring) {
  const r = size / 2, c = r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="vertical-align:-2px">` +
    `<circle cx="${c}" cy="${c}" r="${r}" fill="${shade(ring, 0.75)}"/>` +
    `<circle cx="${c}" cy="${c}" r="${r * 0.92}" fill="${ring}"/>` +
    `<circle cx="${c}" cy="${c}" r="${r * 0.76}" fill="${body}"/>` +
    `<circle cx="${c}" cy="${c}" r="${Math.max(1, r * 0.42)}" fill="none" stroke="${shade(body, 0.55)}" stroke-width="1"/>` +
    `</svg>`;
}
// Tier glyph: stack of 1..4 discs, r = 0.30×size, step 0.55r, bottom-anchored.
function tierSvg(size, tierName, outcome) {
  const count = TIER_COUNT[tierName];
  const color = (outcome === "loss" ? COLORS.tierLoss : COLORS.tierWin)[tierName === "stack" ? "jackpot" : tierName];
  const r = Math.max(2, Math.floor(size * 0.30));
  const step = Math.max(1, Math.floor(r * 0.55));
  const w = r * 2 + 2, h = size;
  const baseY = h - r - 1;
  let discs = "";
  for (let i = count; i >= 1; i--) {
    const cy = baseY - (i - 1) * step;
    discs += `<circle cx="${w / 2}" cy="${cy}" r="${r}" fill="${color}" stroke="${shade(color, 0.55)}" stroke-width="1"/>`;
  }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="vertical-align:-2px">${discs}</svg>`;
}
function arrowSvg(size) {
  const cy = size / 2, sw = size * 0.55, th = Math.max(2, size * 0.16), hh = Math.max(2, size * 0.30);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="vertical-align:-2px">` +
    `<rect x="0" y="${cy - th / 2}" width="${sw}" height="${th}" fill="currentColor"/>` +
    `<polygon points="${sw},${cy - hh} ${sw},${cy + hh} ${size},${cy}" fill="currentColor"/>` +
    `</svg>`;
}
// Token grammar from views/IconText.lua: {([%w_:]+)}; unknown → literal.
function renderIconText(str, size) {
  size = size || 13;
  if (str == null) return "";
  return String(str).replace(/\{([\w:]+)\}|[^{]+|\{/g, (m, token) => {
    if (token === undefined) return esc(m);
    if (token === "chip") return chipSvg(size, COLORS.chip, COLORS.chipRing);
    if (token === "achip") return chipSvg(size, COLORS.achip, COLORS.achipRing);
    if (token === "arrow") return arrowSvg(size);
    const parts = token.split(":");
    const pre = parts.length === 2 ? parts[0] : null;
    const name = parts.length === 2 ? parts[1] : parts[0];
    if (TIER_COUNT[name] !== undefined)
      return tierSvg(size, name, pre === "l" ? "loss" : "win");
    return esc(m); // unknown token stays literal, like IconText.lua:90
  });
}

/* ══════════════ unlock + effect describers ══════════════ */
function condText(cond) {
  if (!cond) return "";
  const isFlag = UNLOCK_FLAGS.has(cond.kind) || cond.threshold == null;
  if (isFlag) return cond.text || cond.kind;
  const thr = cond.format === "money" ? fmtMoney(cond.threshold) : cond.threshold;
  return `0 / ${thr} ${cond.text || cond.kind}`;
}
function unlockStickerHtml(unlock, size) {
  if (!unlock) return "";
  let html = renderIconText(condText(unlock), size || 11);
  if (unlock.mystery)
    html += ` <span class="faint">(??? until: ${renderIconText(condText(unlock.mystery), size || 11)})</span>`;
  return html;
}
function effectLabel(eff) {
  const parts = [eff.kind];
  for (const [k, v] of Object.entries(eff)) {
    if (k === "kind") continue;
    parts.push(`${k}=${typeof v === "object" ? JSON.stringify(v) : v}`);
  }
  return parts.join(" ");
}
function effectTooltip(eff) {
  const reg = S.model.effectKinds[eff.kind];
  let out = "";
  if (reg) {
    out = `<div class="tt-title">${esc(eff.kind)}</div>${esc(reg.description || "")}` +
      `\n<span class="muted">value:</span> ${esc(reg.value_shape || "")}` +
      `\n<span class="muted">affects:</span> ${esc(reg.affects || "")}`;
  } else {
    out = `<div class="tt-title">${esc(eff.kind)}</div><span class="muted">not in data/effects.lua registry</span>`;
  }
  const refId = eff.kind === "proc" ? eff.proc : eff.kind === "router" ? eff.router : null;
  if (refId) {
    const def = (eff.kind === "proc" ? S.model.procs : S.model.routers)[refId];
    out += `\n<span class="muted">${esc(eff.kind)}:</span> <b>${esc(refId)}</b>`;
    if (def) out += "\n" + esc(JSON.stringify(def, null, 1).slice(0, 700));
  }
  return out;
}

/* ══════════════ tooltip plumbing ══════════════ */
const tipEl = $("#tooltip");
function attachTip(elm, htmlFn) {
  elm.addEventListener("mouseenter", () => {
    tipEl.innerHTML = typeof htmlFn === "function" ? htmlFn() : htmlFn;
    tipEl.classList.remove("hidden");
  });
  elm.addEventListener("mousemove", (ev) => {
    const pad = 14;
    let x = ev.clientX + pad, y = ev.clientY + pad;
    const r = tipEl.getBoundingClientRect();
    if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
    if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
    tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
  });
  elm.addEventListener("mouseleave", () => tipEl.classList.add("hidden"));
}

/* ══════════════ filters ══════════════ */
function matchItem(it) {
  const f = S.ui.filters;
  const eff = effective(it);
  if (f.phase && it.raw.phase !== f.phase) return false;
  if (f.act === "1" && it.raw.act === 2) return false;
  if (f.act === "2" && it.raw.act !== 2) return false;
  if (f.dept && S.model.deptOf.get(it.id) !== f.dept) return false;
  if (f.editedOnly && !isEdited(it.id)) return false;
  if (f.tags.length) {
    const mine = itemTags(it.id);
    if (!f.tags.every(t => mine.includes(t))) return false;
  }
  if (f.search) {
    const q = f.search.toLowerCase();
    const hay = [it.id, eff.name, eff.effect_text, eff.description,
                 eff.corrupt_effect_text].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

/* ══════════════ S8 · card component ══════════════ */
async function fillSpriteImg(img, it) {
  const eff = effective(it);
  if (!eff.sprite_target) { img.replaceWith(el("div", { class: "faint",
    style: "width:32px;height:32px;display:flex;align-items:center;justify-content:center" }, "∅")); return; }
  const url = await spriteUrl("assets/sprites/" + eff.sprite_target + ".png");
  if (url) img.src = url; else img.alt = "?";
}
function itemCard(it, opts) {

  if (!matchItem(it)) card.classList.add("dimmed");

    attachTip(b, () => `<div class="tt-title">unlock gate</div>` + unlockStickerHtml(it.raw.unlock, 12));
    badges.appendChild(b);
  }
  if (it.raw.requires && S.model.byId.has(it.raw.requires)) {
    const parent = S.model.byId.get(it.raw.requires);
    const b = el("span", { class: "badge req" }, `SEE No. ${String(parent.no).padStart(3, "0")}`);
    attachTip(b, () => `requires <b>${esc(effective(parent).name)}</b>`);
    badges.appendChild(b);
  }
  if (it.raw.corrupt) {
    const b = el("span", { class: "badge corrupt" }, "corrupt");
    attachTip(b, () => `<div class="tt-title">corrupted (${it.raw.corrupt.cost_achip ?? "?"} anti)</div>` +
      renderIconText(effective(it).corrupt_effect_text || "", 12));
    badges.appendChild(b);
  }
  if (it.raw.act === 2) badges.appendChild(el("span", { class: "badge act2" }, "ACT 2"));
  if (it.raw.slots) badges.appendChild(el("span", { class: "badge" }, `${it.raw.slots} slots`));
  badges.appendChild(el("span", { class: "badge" }, esc(it.raw.phase)));
  if (isEdited(it.id)) badges.appendChild(el("span", { class: "dot edited", title: "has staged edits" }));
  if (S.meta.notes[it.id]) badges.appendChild(el("span", { class: "dot note", title: "has a note" }));
  card.appendChild(badges);

  const tags = itemTags(it.id);
  if (tags.length) {
    const strip = el("div", { class: "tagstrip" });
    for (const t of tags) {
      const s = el("span", { style: `background:${tagColor(t)}` });
      attachTip(s, esc(t));
      strip.appendChild(s);
    }
    card.appendChild(strip);
  }
  card.addEventListener("click", () => openDetail(it.id));
  if (opts.abs) { card.style.left = opts.x + "px"; card.style.top = opts.y + "px"; }
  return card;
}
/* ══════════════ S9 · Views ══════════════ */
function render() {
  lsSet(LS_UI, { tab: S.ui.tab, filters: S.ui.filters, sort: S.ui.sort,
                 groupBy: S.ui.groupBy, bankroll: S.ui.bankroll, sim: S.ui.sim });

/* ── Catalog order view ── */

/* ── Table view ── */
const TABLE_COLS = [
  { key: "no", label: "No.", get: it => it.no },
  { key: "sprite", label: "", get: () => "" },
  { key: "name", label: "Name", get: it => effective(it).name },
  { key: "fx_text", label: "Effect", get: it => effective(it).effect_text || "" },
  { key: "id", label: "id", get: it => it.id },
  { key: "dept", label: "Dept", get: it => S.model.deptOf.get(it.id) },
  { key: "phase", label: "Phase", get: it => it.raw.phase },
  { key: "act", label: "Act", get: it => it.raw.act || 1 },
  { key: "cost", label: "Cost", get: it => it.ownable ? deriveCost(effective(it).cost_chip) : -1 },
  { key: "achip", label: "Corrupt", get: it => effective(it).corrupt_cost_achip ?? -1 },
  { key: "unlock", label: "Unlock", get: it => it.raw.unlock ? it.raw.unlock.kind : "" },
  { key: "thr", label: "Thr", get: it => it.raw.unlock ? (it.raw.unlock.threshold ?? 0) : -1 },
  { key: "requires", label: "Requires", get: it => it.raw.requires || "" },

  { key: "flags", label: "", get: it => (isEdited(it.id) ? 1 : 0) + (S.meta.notes[it.id] ? 2 : 0) },
];
function groupKeyOf(it, groupBy) {
  switch (groupBy) {
    case "dept": return S.model.deptOf.get(it.id);
    case "phase": return it.raw.phase;
    case "act": return "act " + (it.raw.act || 1);
    case "unlock": return it.raw.unlock ? it.raw.unlock.kind : "(no gate)";

}
function viewTable(root) {

    `<option value="">group: none</option><option value="dept">group: department</option>` +
